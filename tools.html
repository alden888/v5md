<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V5 Medical - 外贸效能工具箱</title>
    <meta name="description" content="V5 Medical 专属外贸工具：报价核算、装箱计算、全球时钟、AI指令库及医疗单位换算。">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af', // V5 Medical Blue
                        secondary: '#3b82f6',
                        accent: '#0f172a',
                        success: '#10b981',
                        warning: '#f59e0b',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .tool-card { @apply bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-200 overflow-hidden flex flex-col; }
        .tool-header { @apply bg-gray-50 border-b border-gray-100 p-4 flex items-center justify-between; }
        .tool-title { @apply font-bold text-gray-800 flex items-center gap-2; }
        .tool-body { @apply p-5 flex-grow text-sm text-gray-600; }
        .input-group { @apply mb-3; }
        .input-label { @apply block text-xs font-semibold text-gray-500 uppercase mb-1; }
        .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition; }
        .btn-action { @apply w-full bg-primary hover:bg-blue-800 text-white font-semibold py-2 px-4 rounded transition shadow-sm active:transform active:scale-95; }
        .btn-copy { @apply text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-2 py-1 rounded transition; }
        .result-box { @apply mt-3 p-3 bg-blue-50/50 border border-blue-100 rounded text-blue-900 font-mono text-sm; }
        /* 滚动条隐藏但可滚动 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-700">

    <div id="v5-header"></div>

    <main class="max-w-7xl mx-auto px-4 py-8 pt-24">
        
        <div class="mb-8 bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fas fa-globe-americas text-primary"></i> 全球商机时钟 (客户现在醒着吗?)
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4" id="world-clock-container">
                </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="tool-card border-t-4 border-t-primary">
                <div class="tool-header">
                    <div class="tool-title"><i class="fas fa-calculator text-primary"></i> 快速报价核算 (FOB)</div>
                    <button onclick="saveRate()" class="text-xs text-blue-600 hover:underline">保存汇率</button>
                </div>
                <div class="tool-body">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="input-group">
                            <label class="input-label">工厂含税价 (CNY)</label>
                            <input type="number" id="calc-cost" class="input-field" placeholder="100">
                        </div>
                        <div class="input-group">
                            <label class="input-label">汇率 (USD:CNY)</label>
                            <input type="number" id="calc-rate" class="input-field" placeholder="7.2">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="input-group">
                            <label class="input-label">退税率 (%)</label>
                            <input type="number" id="calc-rebate" class="input-field" value="13">
                        </div>
                        <div class="input-group">
                            <label class="input-label">目标利润率 (%)</label>
                            <input type="number" id="calc-margin" class="input-field" value="20">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">国内杂费 (CNY/Total)</label>
                        <input type="number" id="calc-extra" class="input-field" value="0" placeholder="运费+报关">
                    </div>
                    <button onclick="calculateFOB()" class="btn-action">计算 FOB 美金价</button>
                    <div id="fob-result" class="result-box hidden">
                        <div class="flex justify-between font-bold"><span>FOB Price:</span> <span id="res-price">$0.00</span></div>
                        <div class="flex justify-between text-xs text-gray-500 mt-1"><span>预估退税:</span> <span id="res-tax">¥0.00</span></div>
                        <div class="flex justify-between text-xs text-gray-500"><span>总利润 (含退税):</span> <span id="res-profit">¥0.00</span></div>
                    </div>
                </div>
            </div>

            <div class="tool-card border-t-4 border-t-green-500">
                <div class="tool-header">
                    <div class="tool-title"><i class="fas fa-cube text-green-600"></i> 装箱量计算 (CBM)</div>
                </div>
                <div class="tool-body">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="input-group">
                            <label class="input-label">长 (cm)</label>
                            <input type="number" id="cbm-l" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">宽 (cm)</label>
                            <input type="number" id="cbm-w" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">高 (cm)</label>
                            <input type="number" id="cbm-h" class="input-field">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">总箱数 (Cartons)</label>
                        <input type="number" id="cbm-ctn" class="input-field" placeholder="100">
                    </div>
                    <button onclick="calculateCBM()" class="btn-action bg-green-600 hover:bg-green-700">计算体积</button>
                    <div id="cbm-result" class="result-box hidden">
                        <div class="font-bold text-lg"><span id="res-cbm">0</span> m³</div>
                        <div class="h-2 bg-gray-200 rounded-full mt-2 overflow-hidden">
                            <div id="bar-20gp" class="h-full bg-blue-500" style="width:0%"></div>
                        </div>
                        <div class="text-xs flex justify-between mt-1">
                            <span>20GP: <span id="txt-20gp">0%</span></span>
                            <span>40HQ: <span id="txt-40hq">0%</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tool-card border-t-4 border-t-purple-500">
                <div class="tool-header">
                    <div class="tool-title"><i class="fas fa-ruler-combined text-purple-600"></i> 医疗单位换算</div>
                </div>
                <div class="tool-body space-y-4">
                    <div class="bg-gray-50 p-2 rounded border border-gray-100">
                        <label class="input-label">导管尺寸 (Fr/Ch ⇋ mm)</label>
                        <div class="flex gap-2">
                            <input type="number" id="conv-fr" class="input-field" placeholder="Fr" oninput="convertMedical('fr')">
                            <span class="self-center">=</span>
                            <input type="number" id="conv-mm" class="input-field" placeholder="mm" oninput="convertMedical('mm')">
                        </div>
                        <p class="text-[10px] text-gray-400 mt-1">1 Fr = 0.33 mm (Outer Diameter)</p>
                    </div>
                    <div class="bg-gray-50 p-2 rounded border border-gray-100">
                        <label class="input-label">针头规格 (Gauge → Color)</label>
                        <select id="conv-gauge" class="input-field" onchange="showGaugeColor()">
                            <option value="">选择 G 号</option>
                            <option value="18">18G (1.2mm) - Pink</option>
                            <option value="20">20G (0.9mm) - Yellow</option>
                            <option value="21">21G (0.8mm) - Green</option>
                            <option value="22">22G (0.7mm) - Black</option>
                            <option value="23">23G (0.6mm) - Blue</option>
                            <option value="25">25G (0.5mm) - Orange</option>
                        </select>
                        <div id="gauge-color" class="h-2 mt-1 rounded w-full bg-gray-200 transition-colors duration-300"></div>
                    </div>
                </div>
            </div>

            <div class="tool-card border-t-4 border-t-indigo-500">
                <div class="tool-header">
                    <div class="tool-title"><i class="fas fa-robot text-indigo-600"></i> AI 外贸指令库</div>
                    <span class="text-xs text-gray-400">复制发给 ChatGPT</span>
                </div>
                <div class="tool-body space-y-2">
                    <button onclick="copyPrompt('dev')" class="w-full text-left p-2 hover:bg-indigo-50 rounded border border-transparent hover:border-indigo-100 transition group">
                        <div class="font-bold text-gray-700 text-xs">📧 开发信润色</div>
                        <div class="text-[10px] text-gray-400 truncate">Help me polish this cold email to a medical distributor...</div>
                    </button>
                    <button onclick="copyPrompt('reject')" class="w-full text-left p-2 hover:bg-indigo-50 rounded border border-transparent hover:border-indigo-100 transition group">
                        <div class="font-bold text-gray-700 text-xs">🛡️ 处理客户拒信</div>
                        <div class="text-[10px] text-gray-400 truncate">Client said "Price too high". Write a professional reply emphasizing quality...</div>
                    </button>
                    <button onclick="copyPrompt('desc')" class="w-full text-left p-2 hover:bg-indigo-50 rounded border border-transparent hover:border-indigo-100 transition group">
                        <div class="font-bold text-gray-700 text-xs">📝 产品描述生成</div>
                        <div class="text-[10px] text-gray-400 truncate">Write 5 bullet points for [Product] highlighting CE/ISO compliance...</div>
                    </button>
                    <div class="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-gray-100">
                        <a href="https://chat.openai.com" target="_blank" class="text-center text-xs p-1 bg-gray-100 hover:bg-green-100 rounded">ChatGPT</a>
                        <a href="https://claude.ai" target="_blank" class="text-center text-xs p-1 bg-gray-100 hover:bg-orange-100 rounded">Claude</a>
                        <a href="https://www.perplexity.ai" target="_blank" class="text-center text-xs p-1 bg-gray-100 hover:bg-blue-100 rounded">Perplexity</a>
                    </div>
                </div>
            </div>

            <div class="tool-card border-t-4 border-t-amber-500">
                <div class="tool-header">
                    <div class="tool-title"><i class="fas fa-envelope-open-text text-amber-600"></i> 高频邮件模板</div>
                </div>
                <div class="tool-body">
                    <div class="flex gap-2 mb-3 overflow-x-auto hide-scrollbar pb-1">
                        <button onclick="setTemplate('quote')" class="px-3 py-1 bg-amber-100 text-amber-700 text-xs rounded-full whitespace-nowrap hover:bg-amber-200">报价单</button>
                        <button onclick="setTemplate('sample')" class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-full whitespace-nowrap hover:bg-gray-200">寄样通知</button>
                        <button onclick="setTemplate('payment')" class="px-3 py-1 bg-gray-100 text-gray-600 text-xs rounded-full whitespace-nowrap hover:bg-gray-200">催付水单</button>
                    </div>
                    <input type="text" id="mail-subject" class="input-field mb-2 text-xs font-bold" placeholder="邮件主题" readonly>
                    <textarea id="mail-body" class="input-field h-24 text-xs resize-none mb-2" placeholder="邮件内容..." readonly></textarea>
                    <div class="flex gap-2">
                        <button onclick="copyMail()" class="flex-1 btn-action bg-gray-800 hover:bg-gray-900 text-xs py-1.5"><i class="fas fa-copy"></i> 复制</button>
                        <a href="mailto:" id="btn-send-mail" class="flex-1 btn-action bg-amber-600 hover:bg-amber-700 text-xs py-1.5 text-center"><i class="fas fa-paper-plane"></i> 调起邮箱</a>
                    </div>
                </div>
            </div>

            <div class="tool-card border-t-4 border-t-gray-500">
                <div class="tool-header">
                    <div class="tool-title"><i class="fas fa-shipping-fast text-gray-600"></i> 物流与单证</div>
                </div>
                <div class="tool-body space-y-4">
                    <div>
                        <label class="input-label">金额转大写 (For PI)</label>
                        <div class="flex gap-2">
                            <input type="number" id="amount-num" class="input-field" placeholder="1234.50" oninput="convertAmount()">
                        </div>
                        <div id="amount-text" class="text-xs text-gray-500 italic mt-1 min-h-[1.2em]">English amount will appear here...</div>
                    </div>
                    <div class="pt-3 border-t border-gray-100">
                        <label class="input-label">物流查询入口</label>
                        <div class="grid grid-cols-3 gap-2 text-xs text-center font-medium text-white">
                            <a href="https://www.dhl.com/en/express/tracking.html" target="_blank" class="bg-[#d40511] py-1 rounded hover:opacity-90">DHL</a>
                            <a href="https://www.fedex.com/fedextrack/" target="_blank" class="bg-[#4d148c] py-1 rounded hover:opacity-90">FedEx</a>
                            <a href="https://www.ups.com/track" target="_blank" class="bg-[#ffb500] text-black py-1 rounded hover:opacity-90">UPS</a>
                            <a href="https://www.marinetraffic.com/" target="_blank" class="bg-blue-500 py-1 rounded hover:opacity-90 col-span-3"><i class="fas fa-ship"></i> 海运查船 (MarineTraffic)</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="v5-footer"></div>

    <script src="js/config.js?v=2.7.0"></script>
    <script src="js/layout.js?v=4.8.3"></script>
    
    <script>
        // --- 1. Global Clock ---
        const cities = [
            { name: 'Beijing', tz: 'Asia/Shanghai', icon: '🇨🇳' },
            { name: 'London', tz: 'Europe/London', icon: '🇬🇧' },
            { name: 'New York', tz: 'America/New_York', icon: '🇺🇸' },
            { name: 'Dubai', tz: 'Asia/Dubai', icon: '🇦🇪' },
            { name: 'Istanbul', tz: 'Europe/Istanbul', icon: '🇹🇷' }
        ];

        function updateClock() {
            const container = document.getElementById('world-clock-container');
            container.innerHTML = cities.map(city => {
                const now = new Date().toLocaleTimeString('en-US', { timeZone: city.tz, hour: '2-digit', minute: '2-digit', hour12: false });
                const hour = parseInt(now.split(':')[0]);
                // 简单的判断：9:00 - 18:00 为工作时间
                const isWorking = hour >= 9 && hour < 18;
                const statusColor = isWorking ? 'text-green-500' : 'text-gray-400';
                const statusText = isWorking ? 'Open' : 'Closed';
                
                return `
                    <div class="text-center p-2 rounded bg-gray-50 border border-gray-100">
                        <div class="text-xs text-gray-500 mb-1">${city.icon} ${city.name}</div>
                        <div class="font-mono font-bold text-gray-800 text-lg">${now}</div>
                        <div class="text-[10px] font-bold ${statusColor} uppercase tracking-wider">● ${statusText}</div>
                    </div>
                `;
            }).join('');
        }
        setInterval(updateClock, 60000); // Update every minute
        updateClock(); // Init

        // --- 2. FOB Calculator ---
        // Load saved rate
        document.getElementById('calc-rate').value = localStorage.getItem('v5_usd_rate') || 7.2;

        function saveRate() {
            const rate = document.getElementById('calc-rate').value;
            localStorage.setItem('v5_usd_rate', rate);
            alert('汇率 ' + rate + ' 已保存');
        }

        function calculateFOB() {
            const cost = parseFloat(document.getElementById('calc-cost').value) || 0;
            const rate = parseFloat(document.getElementById('calc-rate').value) || 7.2;
            const rebate = parseFloat(document.getElementById('calc-rebate').value) || 13;
            const margin = parseFloat(document.getElementById('calc-margin').value) || 20; // 20% margin
            const extra = parseFloat(document.getElementById('calc-extra').value) || 0;

            if(cost === 0) return;

            // 核心公式：
            // 实际成本 = 含税成本 - 退税
            // 退税 = 含税成本 / 1.13 * 退税率
            const taxBase = cost / 1.13;
            const taxRefund = taxBase * (rebate / 100);
            const realCost = cost - taxRefund + extra;
            
            // 报价 = 实际成本 / (1 - 利润率) / 汇率
            // Margin is based on Revenue (GP)
            const fobPrice = (realCost / (1 - (margin/100))) / rate;
            const profitRMB = (fobPrice * rate) - realCost;

            document.getElementById('res-price').textContent = '$' + fobPrice.toFixed(2);
            document.getElementById('res-tax').textContent = '¥' + taxRefund.toFixed(2);
            document.getElementById('res-profit').textContent = '¥' + profitRMB.toFixed(2);
            document.getElementById('fob-result').classList.remove('hidden');
        }

        // --- 3. CBM Calculator ---
        function calculateCBM() {
            const l = parseFloat(document.getElementById('cbm-l').value) || 0;
            const w = parseFloat(document.getElementById('cbm-w').value) || 0;
            const h = parseFloat(document.getElementById('cbm-h').value) || 0;
            const ctn = parseInt(document.getElementById('cbm-ctn').value) || 0;

            if(l*w*h === 0) return;

            // cm to m
            const volPerCtn = (l * w * h) / 1000000;
            const totalVol = volPerCtn * ctn;

            // Container cap (approx)
            const c20 = 28; 
            const c40hq = 68;

            document.getElementById('res-cbm').textContent = totalVol.toFixed(3);
            document.getElementById('txt-20gp').textContent = ((totalVol/c20)*100).toFixed(1) + '%';
            document.getElementById('txt-40hq').textContent = ((totalVol/c40hq)*100).toFixed(1) + '%';
            
            // Visual bar (max 100%)
            const width = Math.min((totalVol/c20)*100, 100);
            const bar = document.getElementById('bar-20gp');
            bar.style.width = width + '%';
            bar.className = width > 100 ? 'h-full bg-red-500' : 'h-full bg-blue-500';

            document.getElementById('cbm-result').classList.remove('hidden');
        }

        // --- 4. Medical Unit Converter ---
        function convertMedical(type) {
            const fr = document.getElementById('conv-fr');
            const mm = document.getElementById('conv-mm');
            
            if(type === 'fr') {
                mm.value = (fr.value / 3).toFixed(2);
            } else {
                fr.value = (mm.value * 3).toFixed(1);
            }
        }

        function showGaugeColor() {
            const val = document.getElementById('conv-gauge').value;
            const bar = document.getElementById('gauge-color');
            const colors = {
                '18': '#ffc0cb', // Pink
                '20': '#ffff00', // Yellow
                '21': '#008000', // Green
                '22': '#000000', // Black
                '23': '#0000ff', // Blue
                '25': '#ffa500'  // Orange
            };
            bar.style.backgroundColor = colors[val] || '#e5e7eb';
        }

        // --- 5. AI Prompts ---
        const prompts = {
            'dev': 'Write a short, professional cold email to a medical device distributor. Introduce [My Company] as an ISO13485 certified manufacturer of [Product]. Highlight competitive price and stable quality. Keep it under 150 words.',
            'reject': 'A client rejected our quote saying "price is too high". Write a polite reply acknowledging their concern, but explaining our value proposition (raw material quality, QC standards, CE certification). Offer a small discount for a trial order.',
            'desc': 'Write 5 professional bullet points for [Medical Product] product description on Amazon. Focus on: Sterility, Ease of use, Patient comfort, Compliance.'
        };

        function copyPrompt(key) {
            navigator.clipboard.writeText(prompts[key]).then(() => {
                alert('Prompt copied! Paste it into ChatGPT.');
            });
        }

        // --- 6. Email Templates ---
        const templates = {
            'quote': {
                sub: 'Quotation for V5 Medical Products - [Date]',
                body: "Dear [Name],\n\nThank you for your inquiry. Please find the attached quotation for [Product].\n\n- Terms: FOB Shanghai\n- Lead time: 20 days\n- Validity: 15 days\n\nLet me know if you have any questions.\n\nBest regards,\nV5 Medical Team"
            },
            'sample': {
                sub: 'Samples Sent - Tracking Number [No.]',
                body: "Dear [Name],\n\nGood news! Your samples have been dispatched via FedEx today.\n\nTracking No.: [Number]\n\nYou should receive them within 3-5 days. We look forward to your feedback.\n\nBest regards,"
            },
            'payment': {
                sub: 'Bank Slip Request - Invoice #[No.]',
                body: "Dear [Name],\n\nFriendly reminder that production for Invoice #[No.] is ready to start.\n\nCould you please send us the bank slip once the deposit is arranged? This will help us secure the raw materials immediately.\n\nThanks,\nAlden"
            }
        };

        function setTemplate(key) {
            const t = templates[key];
            document.getElementById('mail-subject').value = t.sub;
            document.getElementById('mail-body').value = t.body;
            document.getElementById('btn-send-mail').href = `mailto:?subject=${encodeURIComponent(t.sub)}&body=${encodeURIComponent(t.body)}`;
            
            // UI Feedback: Highlight active button
            document.querySelectorAll('.tool-card:nth-child(5) button').forEach(b => b.classList.remove('bg-amber-200'));
            event.target.classList.add('bg-amber-200');
        }

        function copyMail() {
            const sub = document.getElementById('mail-subject').value;
            const body = document.getElementById('mail-body').value;
            if(!sub) return;
            navigator.clipboard.writeText(`Subject: ${sub}\n\n${body}`).then(() => alert('Copied to clipboard!'));
        }

        // --- 7. Number to Words (Simplified) ---
        function convertAmount() {
            const num = document.getElementById('amount-num').value;
            if(!num) { document.getElementById('amount-text').textContent = ''; return; }
            // 简单的占位符，实际需要引入 heavy library，这里为了性能做简单提示
            // 在实际外贸中，建议用户复制数字去专门的转换网站，或者只需简单的 "SAY TOTAL US DOLLARS..."
            document.getElementById('amount-text').textContent = "SAY TOTAL US DOLLARS " + num + " ONLY. (Please double check invoice amount)";
        }

    </script>
    <div id="google_translate_element" class="fixed top-4 right-4 z-50"></div>
</body>
</html>
