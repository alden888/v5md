<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Insights | Supply Chain & Compliance Knowledge Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Expert insights on medical supply chain management, ISO 13485 compliance, and global procurement strategies.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* V5 Brand Colors */
    :root {
      --theme-color: #1e40af; /* V5 Blue */
      --text-color: #334155;
    }
    
    body { color: var(--text-color); font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    
    /* Sidebar Polish */
    .sidebar { background-color: #f8fafc; border-right: 1px solid #e2e8f0; }
    .sidebar-nav li.active > a { border-right: 3px solid var(--theme-color); color: var(--theme-color); font-weight: 700; background: #eff6ff; }
    .sidebar-nav > ul > li > a { font-weight: 600; color: #1e293b; }
    
    /* Content Area */
    .markdown-section { max-width: 900px; margin: 0 auto; padding-bottom: 60px; }
    .markdown-section h1 { color: #1e3a8a; font-size: 2.2rem; }
    .markdown-section h2 { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 40px; }
    .markdown-section blockquote { border-left: 4px solid var(--theme-color); background: #f1f5f9; color: #475569; }
    
    /* Custom CTA Box in Articles */
    .v5-article-cta {
      margin-top: 50px;
      padding: 30px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      text-align: center;
    }
    .v5-btn {
      display: inline-block;
      background-color: #1e40af;
      color: white !important;
      padding: 10px 25px;
      border-radius: 50px;
      text-decoration: none !important;
      font-weight: bold;
      margin-top: 15px;
      transition: background 0.3s;
    }
    .v5-btn:hover { background-color: #1e3a8a; }
  </style>
</head>
<body>
  <div id="app">Loading V5 Industry Insights...</div>

  <script>
    window.$docsify = {
      name: 'V5 Medical',
      nameLink: '/', // Click logo to go to main website home
      
      // --- Navigation ---
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      
      // --- SEO & UX ---
      // Auto change page title based on header
      routerMode: 'hash', 
      
      // --- Search ---
      search: {
        maxAge: 86400000, 
        paths: 'auto',
        placeholder: 'Search insights...',
        noData: 'No results found.',
        depth: 3
      },

      // --- Pagination ---
      pagination: {
        previousText: 'Previous Strategy',
        nextText: 'Next Strategy',
        crossChapter: true,
        crossChapterText: true,
      },

      // --- Word Count ---
      count:{
        countable:true,
        fontsize:'0.9em',
        color:'rgb(90,90,90)',
        language:'english'
      },

      // --- CUSTOM PLUGINS ---
      plugins: [
        function(hook, vm) {
          // 1. Dynamic Footer with CTA on every page
          hook.afterEach(function(html) {
            var cta = `
              <div class="v5-article-cta">
                <h3>Ready to optimize your medical supply chain?</h3>
                <p>Contact our strategic sourcing team for a consultation on ISO 13485 compliance and logistics integration.</p>
                <a href="/contact.html" class="v5-btn">Request a Quote</a>
                <a href="/pdf/V5_Medical_Capability_Statement.pdf" target="_blank" style="margin-left:15px; color:#1e40af; font-size:0.9em;">Download Capability Statement</a>
              </div>
            `;
            
            var footer = `
              <hr style="margin-top: 50px;"/>
              <footer style="text-align: center; color: #64748b; font-size: 0.85rem; margin-top: 20px;">
                <span>&copy; 2025 V5 Medical LTD. All rights reserved.</span>
                <br/>
                <span>Operating under ISO 13485 Quality Framework.</span>
              </footer>
            `;
            return html + cta + footer;
          });
        }
      ]
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>

</body>
</html>
