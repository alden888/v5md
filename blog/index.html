<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Knowledge Hub | Supply Chain Intelligence</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="canonical" href="https://v5md.com/blog/">
  <meta property="og:title" content="V5 Medical Knowledge Hub">
  <meta property="og:description" content="Professional insights for medical buyers and distributors">
  <meta property="og:url" content="https://v5md.com/blog/">
  <meta property="og:image" content="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* 样式保持不变 */
    :root { --theme-color: #1e40af; --text-color: #334155; }
    body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--text-color); }
    /* Sidebar */
    .sidebar { background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%); border-right: 1px solid #e2e8f0; }
    .sidebar-nav li.active > a { border-right: 3px solid var(--theme-color); color: var(--theme-color); font-weight: 700; background: #eff6ff; }
    /* Content */
    .markdown-section { max-width: 900px; margin: 0 auto; padding: 30px 20px 80px; }
    .markdown-section h1 { color: #1e3a8a; font-weight: 800; }
    .markdown-section h2 { border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; margin-top: 48px; color: #1e40af; }
    /* CTA Box */
    .v5-cta-box { margin: 50px 0; padding: 40px; background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border: 2px solid #93c5fd; border-radius: 12px; text-align: center; }
    .v5-btn { display: inline-block; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white !important; padding: 12px 32px; border-radius: 50px; text-decoration: none !important; font-weight: 700; margin: 8px; }
    .v5-btn-secondary { background: white !important; color: #1e40af !important; border: 2px solid #3b82f6; }
    /* Progress Bar */
    #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #1e40af, #3b82f6, #60a5fa); z-index: 9999; transition: width 0.2s; }
    @media (max-width: 768px) { .v5-btn { display: block; width: 100%; } }
  </style>
</head>

<body>
  <div id="progress-bar"></div>
  
  <div id="app">🚀 Loading V5 Medical Knowledge Hub...</div>

  <script>
    window.$docsify = {
      // ===== 核心路径配置 =====
      basePath: '/blog/', 
      // relativePath: true, // 已删除，避免路径冲突
      
      // ===== 基础信息 =====
      name: '<img src="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png" style="height:40px;vertical-align:middle;margin-right:8px;">V5 Medical',
      nameLink: 'https://v5md.com',
      repo: 'https://github.com/alden888/v5md',
      homepage: 'README.md',
      
      // ===== 功能模块 =====
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: true,
      onlyCover: false,
      routerMode: 'hash', 
      
      // ===== 搜索 =====
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search insights...',
        depth: 6,
      },
      
      // ===== 翻页 =====
      pagination: {
        previousText: '← Previous Strategy',
        nextText: 'Next Strategy →',
        crossChapter: true,
      },
      
      // ===== 复制按钮 =====
      copyCode: {
        buttonText: 'Copy',
        successText: '✓ Copied'
      },
      
      // ===== 插件系统 =====
      plugins: [
        // 1. 底部 CTA 插入
        function(hook) {
          hook.afterEach(function(html) {
            const cta = `
              <div class="v5-cta-box">
                <h3>🎯 Ready to Optimize Your Supply Chain?</h3>
                <p>Download our <strong>Capability Statement</strong> or speak with our strategic sourcing experts.</p>
                <a href="https://v5md.com/pdf/V5_Medical_Capability_Statement.pdf" target="_blank" class="v5-btn">
                  <i class="fas fa-file-shield"></i> Download Capability Statement
                </a>
                <a href="https://v5md.com/contact.html" class="v5-btn v5-btn-secondary">
                  <i class="fas fa-comments"></i> Request Consultation
                </a>
                <a href="https://wa.me/447895047944?text=I'm interested in V5 Medical's supply chain solutions" target="_blank" class="v5-btn" style="background:linear-gradient(135deg,#10b981,#34d399);">
                  <i class="fab fa-whatsapp"></i> WhatsApp Inquiry
                </a>
              </div>
            `;
            const footer = `
              <hr style="margin-top: 60px; border: none; border-top: 2px solid #e5e7eb;"/>
              <footer style="text-align: center; padding: 30px 0; color: #64748b; font-size: 0.85rem;">
                <p style="margin-bottom: 8px;">&copy; 2025 <strong>V5 Medical LTD</strong> | Operating Under ISO 13485 Quality Framework</p>
                <p style="margin-top: 12px; font-size: 0.8rem; opacity: 0.8;">
                  <a href="https://v5md.com" style="color: #3b82f6; margin: 0 8px;">Main Website</a> •
                  <a href="https://v5md.com/contact.html" style="color: #3b82f6; margin: 0 8px;">Contact</a> •
                  <a href="https://v5md.com/privacy.html" style="color: #3b82f6; margin: 0 8px;">Privacy</a>
                </p>
              </footer>
            `;
            return html + cta + footer;
          });
        },
        
        // 2. 阅读进度条逻辑
        function(hook) {
          hook.doneEach(function() {
            const progressBar = document.getElementById('progress-bar');
            window.addEventListener('scroll', function() {
              const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
              const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
              const progress = (scrollTop / scrollHeight) * 100;
              progressBar.style.width = progress + '%';
            });
          });
        }
      ]
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>

</body>
</html>
