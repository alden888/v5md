<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Blog | Industry Insights & News</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Insights on Medical Supply Chain, ISO 13485 Compliance, and Global Sourcing.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* 主色调匹配 V5 Blue (#1e40af) */
    :root {
      --theme-color: #1e40af;
    }
    .app-name-link img {
      height: 40px; /* Logo size */
    }
    /* 侧边栏样式微调 */
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }
    .sidebar-nav li.active > a {
      border-right: 2px solid var(--theme-color);
      color: var(--theme-color);
      font-weight: 600;
    }
    /* 顶部导航样式 */
    .app-nav a {
      color: #333;
      font-weight: 600;
    }
    .app-nav a:hover {
      color: var(--theme-color);
      text-decoration: underline;
    }
    /* 内容区最大宽度，优化阅读体验 */
    .markdown-section {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="app">Loading V5 Insights...</div>

  <script>
    window.$docsify = {
      // --- 基本设置 ---
      name: 'V5 Medical', // 左上角显示的名称
      logo: '/images/icons/favicon.ico', // 或者用你的 Logo 图片路径
      nameLink: '/', // 点击 Logo 回到博客主页
      
      // --- 核心功能 ---
      loadSidebar: true, // 开启侧边栏 (_sidebar.md)
      loadNavbar: true,  // 开启顶部导航 (_navbar.md)
      subMaxLevel: 2,    // 侧边栏自动显示 H2 标题
      auto2top: true,    // 切换页面自动回到顶部
      
      // --- 封面设置 (可选，不需要很花哨的话设为 false) ---
      coverpage: false, 

      // --- 搜索插件配置 ---
      search: {
        maxAge: 86400000, 
        paths: 'auto',
        placeholder: 'Search articles...',
        noData: 'No results found.',
        depth: 4
      },

      // --- 复制到剪贴板 ---
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },

      // --- 底部版权信息 (使用插件插入) ---
      plugins: [
        function(hook) {
          var footer = [
            '<hr/>',
            '<footer>',
            '<span>&copy; 2025 V5 Medical LTD. All rights reserved.</span>',
            '<span style="float: right;">Structured for Compliance.</span>',
            '</footer>'
          ].join('');

          hook.afterEach(function(html) {
            return html + footer;
          });
        }
      ]
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

</body>
</html>
