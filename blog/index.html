<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Knowledge Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="canonical" href="https://v5md.com/blog/">
  <meta property="og:title" content="V5 Medical Knowledge Hub">
  <meta property="og:url" content="https://v5md.com/blog/">
  <meta property="og:image" content="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* =========================================
       1. 全局重置与变量 (匹配主站)
       ========================================= */
    :root { 
      --theme-color: #1e40af; 
      --theme-hover: #1e3a8a;
      --text-color: #334155;
      --header-height: 80px; /* 主站通常是 80px */
    }
    
    body { 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      color: var(--text-color);
      padding-top: var(--header-height); /* 给固定页眉留空间 */
      background-color: #f8fafc; /* 与主站背景协调 */
    }

    /* =========================================
       2. 复刻主站 Header (1:1 还原)
       ========================================= */
    .v5-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-height);
      background: #ffffff;
      /* 主站风格的阴影 */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #f1f5f9;
    }

    .header-container {
      width: 100%;
      max-width: 1280px; /* 匹配 Tailwind max-w-7xl */
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }

    /* Logo 区域 */
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .header-logo img { height: 48px; width: auto; } /* 主站 Logo 通常稍大 */
    .logo-text { display: flex; flex-direction: column; }
    .brand-name { 
      font-size: 1.25rem; 
      font-weight: 800; 
      color: #1e3a8a; 
      line-height: 1; 
      letter-spacing: -0.025em; 
    }
    .brand-tag { 
      font-size: 0.65rem; 
      color: #1d4ed8; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      margin-top: 2px; 
    }

    /* 导航菜单 */
    .header-nav { display: flex; gap: 32px; margin-left: 40px; }
    .nav-link {
      text-decoration: none;
      color: #475569;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
      position: relative;
    }
    .nav-link:hover { color: var(--theme-color); }
    .nav-link.active { color: var(--theme-color); font-weight: 700; }
    /* 激活态下划线 */
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -28px; /* 对齐 Header 底部 */
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #93c5fd;
    }

    /* 右侧按钮区 */
    .header-actions { display: flex; align-items: center; gap: 16px; }
    
    /* WhatsApp 按钮 (复刻主站风格) */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #22c55e; /* Tailwind green-500 */
      color: white;
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .btn-whatsapp:hover {
      background-color: #16a34a; /* Tailwind green-600 */
      transform: translateY(-1px);
    }

    /* =========================================
       3. Docsify 布局适配
       ========================================= */
    .sidebar {
      top: var(--header-height) !important; /* 避开 Header */
      padding-top: 20px !important;
      background-color: #fff;
      border-right: 1px solid #f1f5f9;
      z-index: 900;
    }
    
    .content { padding-top: 20px; }
    
    /* 侧边栏开关按钮位置调整 */
    .sidebar-toggle {
      top: 95px !important; 
      left: 20px !important;
      background: transparent !important;
      color: var(--theme-color) !important;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .header-nav { display: none; } /* 手机端隐藏顶部导航 */
      .btn-whatsapp span { display: none; } /* 手机端只显示图标 */
      .btn-whatsapp { padding: 8px; }
      .brand-tag { display: none; }
    }

    /* =========================================
       4. 文章样式微调 (保持之前的优化)
       ========================================= */
    .markdown-section { 
      max-width: 960px; 
      margin: 0 auto; 
      padding: 40px 40px 100px; 
      background: #fff;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); /* 给文章加个卡片阴影，更像主站 */
      border-radius: 8px;
      min-height: calc(100vh - 120px);
    }
    /* ... 保留之前的 CTA 和 Footer 样式 ... */
    .v5-cta-box { margin: 60px 0; padding: 40px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center; }
    .v5-btn { display: inline-block; background: #1e40af; color: white !important; padding: 12px 30px; border-radius: 50px; font-weight: 600; text-decoration: none; margin: 5px; }
    .v5-btn:hover { background: #1e3a8a; }
    .v5-btn-secondary { background: white; color: #1e40af !important; border: 1px solid #1e40af; }
  </style>
</head>

<body>
  <header class="v5-header">
    <div class="header-container">
      <a href="https://v5md.com/" class="header-logo">
        <img src="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png" alt="V5 Medical">
        <div class="logo-text">
          <span class="brand-name">V5 Medical LTD</span>
          <span class="brand-tag">Global Supply Chain</span>
        </div>
      </a>

      <nav class="header-nav">
        <a href="https://v5md.com/" class="nav-link">Home</a>
        <a href="https://v5md.com/about.html" class="nav-link">About Us</a>
        <a href="https://v5md.com/catalog.html" class="nav-link">Products</a>
        <a href="#/" class="nav-link active">Blog</a>
        <a href="https://v5md.com/contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="header-actions">
        <div id="google_translate_element"></div>
        
        <a href="https://wa.me/447895047944" target="_blank" class="btn-whatsapp">
          <i class="fab fa-whatsapp" style="font-size: 1.2rem;"></i>
          <span>Contact</span>
        </a>
      </div>
    </div>
  </header>

  <div id="app">🚀 Loading Knowledge Hub...</div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    window.$docsify = {
      basePath: 'https://raw.githubusercontent.com/alden888/v5md/main/blog/',
      encoding: 'utf-8',
      nameLink: 'https://v5md.com',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: false, // 关掉原生导航，用我们手写的 Header
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false, 
      routerMode: 'hash',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search insights...',
        depth: 6,
      },
      plugins: [
        function(hook) {
          // 渲染前过滤
          hook.beforeEach(function(content, url) {
            if (url && url.endsWith('.md')) {
              return content
                .replace(/<script[\s\S]*?<\/script>/gi, '') 
                .replace(/<style[\s\S]*?<\/style>/gi, '')   
                .replace(/[\u0000-\u001F\u007F]/g, '')
                .replace(/^\*\*|^\#+/gm, '') 
                .replace(/^\-\-\-/gm, '');
            }
            return content;
          });
          
          // 渲染后加 CTA
          hook.afterEach(function(html) {
            return html + `
              <div class="v5-cta-box">
                <h3>🎯 Ready to Optimize?</h3>
                <p>Download our Capability Statement for details.</p>
                <a href="/pdf/V5_Medical_Capability_Statement.pdf" target="_blank" class="v5-btn">Download PDF</a>
                <a href="/contact.html" class="v5-btn v5-btn-secondary">Contact Sales</a>
              </div>
              <footer style="text-align:center;margin-top:40px;color:#94a3b8;font-size:0.85rem;">
                &copy; 2025 V5 Medical LTD | ISO 13485 Certified Framework
              </footer>
            `;
          });
        }
      ]
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
