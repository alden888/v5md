<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Knowledge Hub | Supply Chain Intelligence</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="canonical" href="https://v5md.com/blog/">
  <meta property="og:title" content="V5 Medical Knowledge Hub">
  <meta property="og:description" content="Professional insights for medical buyers and distributors">
  <meta property="og:url" content="https://v5md.com/blog/">
  <meta property="og:image" content="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* 样式保持不变 */
    :root { --theme-color: #1e40af; --text-color: #334155; }
    body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--text-color); }
    /* Sidebar */
    .sidebar { background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%); border-right: 1px solid #e2e8f0; }
    .sidebar-nav li.active > a { border-right: 3px solid var(--theme-color); color: var(--theme-color); font-weight: 700; background: #eff6ff; }
    /* Content */
    .markdown-section { max-width: 900px; margin: 0 auto; padding: 30px 20px 80px; }
    .markdown-section h1 { color: #1e3a8a; font-weight: 800; }
    .markdown-section h2 { border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; margin-top: 48px; color: #1e40af; }
    /* CTA Box */
    .v5-cta-box { margin: 50px 0; padding: 40px; background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border: 2px solid #93c5fd; border-radius: 12px; text-align: center; }
    .v5-btn { display: inline-block; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white !important; padding: 12px 32px; border-radius: 50px; text-decoration: none !important; font-weight: 700; margin: 8px; }
    .v5-btn-secondary { background: white !important; color: #1e40af !important; border: 2px solid #3b82f6; }
    /* Progress Bar */
    #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #1e40af, #3b82f6, #60a5fa); z-index: 9999; transition: width 0.2s; }
    @media (max-width: 768px) { .v5-btn { display: block; width: 100%; } }
  </style>
</head>

<body>
  <div id="progress-bar"></div>
  <div id="app">🚀 Loading V5 Medical Knowledge Hub...</div>

  <script>
  window.$docsify = {
    /* =========================
       基础路径（关键）
    ========================= */
    basePath: '/blog/',
    relativePath: true,   // ★ 必须开启
    homepage: 'README.md',

    /* =========================
       品牌信息
    ========================= */
    name: '<img src="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png" style="height:40px;vertical-align:middle;margin-right:8px;">V5 Medical',
    nameLink: 'https://v5md.com',
    repo: 'https://github.com/alden888/v5md',

    /* =========================
       文档结构
    ========================= */
    loadSidebar: true,
    loadNavbar: true,
    subMaxLevel: 3,
    auto2top: true,

    /* ⚠️ 关键：关闭 cover 对 posts 的干扰 */
    coverpage: false,

    /* =========================
       路由模式
    ========================= */
    routerMode: 'hash',

    /* =========================
       🔥 最关键：强制 Markdown 解析
    ========================= */
    markdown: {
      smartypants: true,
      renderer: {
        code: function(code, lang) {
          return this.origin.code.apply(this, arguments);
        }
      }
    },

    /* =========================
       搜索
    ========================= */
    search: {
      maxAge: 86400000,
      paths: 'auto',
      placeholder: 'Search insights...',
      depth: 6
    },

    /* =========================
       翻页
    ========================= */
    pagination: {
      previousText: '← Previous',
      nextText: 'Next →',
      crossChapter: true
    },

    /* =========================
       插件（你原来的 CTA / footer）
    ========================= */
    plugins: [
      function (hook) {
        hook.afterEach(function (html) {
          const cta = `
            <div class="v5-cta-box">
              <h3>🎯 Ready to Optimize Your Supply Chain?</h3>
              <p>Download our <strong>Capability Statement</strong> or speak with our sourcing experts.</p>
              <a href="https://v5md.com/pdf/V5_Medical_Capability_Statement.pdf" target="_blank" class="v5-btn">
                Download Capability Statement
              </a>
              <a href="https://v5md.com/contact.html" class="v5-btn v5-btn-secondary">
                Request Consultation
              </a>
            </div>
          `;
          return html + cta;
        });
      }
    ]
  }
</script>


  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  
  </body>
</html>
