<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Knowledge Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="canonical" href="https://v5md.com/blog/">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* ... 您的 CSS 样式保持原样，为了简洁我省略了 ... */
    :root { --theme-color: #1e40af; --text-color: #334155; }
    body { font-family: 'Inter', sans-serif; color: var(--text-color); }
    /* 请保留您之前美化过的所有 CSS */
  </style>
</head>

<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      // 🛑 核心修复区 🛑
      // 1. 强制指定根目录
      basePath: '/blog/',
      
      // 2. ⚠️ 必须删除 relativePath，或者显式设为 false
      relativePath: false,
      
      // 3. 确保首页指向正确
      homepage: 'README.md',
      
      // ===== 其他配置 =====
      name: 'V5 Medical',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      routerMode: 'hash', 
      
      // ... 您的插件配置保持不变 ...
      plugins: [
        function(hook) {
          hook.afterEach(function(html) {
            // ... 您的 CTA 和 Footer 代码 ...
            return html + '<footer style="text-align:center;margin-top:50px;color:#888;">&copy; V5 Medical LTD</footer>';
          });
        }
      ]
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  </body>
</html>
