<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Knowledge Hub | Supply Chain Intelligence</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Expert insights on medical supply chain management, ISO 13485 compliance, and global sourcing strategies from V5 Medical LTD.">
  <meta name="keywords" content="medical supply chain, ISO 13485, regulatory compliance, China medical sourcing, B2B medical insights">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="canonical" href="https://v5md.com/blog/">
  <meta property="og:title" content="V5 Medical Knowledge Hub">
  <meta property="og:description" content="Professional insights for medical buyers and distributors">
  <meta property="og:url" content="https://v5md.com/blog/">
  <meta property="og:image" content="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    :root {
      --theme-color: #1e40af;
      --text-color: #334155;
      --sidebar-width: 280px;
    }
    
    /* ===== 1. Global Styles ===== */
    body { 
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; 
      color: var(--text-color);
    }
    
    /* ===== 2. Sidebar Enhancement ===== */
    .sidebar { 
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      border-right: 1px solid #e2e8f0;
    }
    .sidebar-nav > ul > li > a { 
      font-weight: 600; 
      color: #1e293b;
      transition: all 0.2s;
    }
    .sidebar-nav li.active > a { 
      border-right: 3px solid var(--theme-color); 
      color: var(--theme-color); 
      font-weight: 700; 
      background: #eff6ff;
      padding-right: 10px;
    }
    .sidebar-nav a:hover {
      color: var(--theme-color);
      padding-left: 8px;
    }
    
    /* ===== 3. Content Area ===== */
    .markdown-section { 
      max-width: 900px; 
      margin: 0 auto; 
      padding: 30px 20px 80px;
    }
    .markdown-section h1 { 
      color: #1e3a8a; 
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    .markdown-section h2 { 
      border-bottom: 2px solid #e5e7eb; 
      padding-bottom: 12px; 
      margin-top: 48px;
      color: #1e40af;
      font-weight: 700;
    }
    .markdown-section blockquote { 
      border-left: 4px solid var(--theme-color); 
      background: #f1f5f9; 
      color: #475569;
      padding: 15px 20px;
      margin: 24px 0;
      font-style: italic;
    }
    
    /* ===== 4. Professional CTA Box ===== */
    .v5-cta-box {
      margin: 50px 0;
      padding: 40px;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 2px solid #93c5fd;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(30, 64, 175, 0.1);
    }
    .v5-cta-box h3 {
      color: #1e3a8a;
      font-size: 1.5rem;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .v5-cta-box p {
      color: #475569;
      font-size: 1rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .v5-btn {
      display: inline-block;
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      color: white !important;
      padding: 12px 32px;
      border-radius: 50px;
      text-decoration: none !important;
      font-weight: 700;
      margin: 8px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
      font-size: 0.95rem;
    }
    .v5-btn:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 64, 175, 0.4);
    }
    .v5-btn-secondary {
      background: white !important;
      color: #1e40af !important;
      border: 2px solid #3b82f6;
    }
    .v5-btn-secondary:hover {
      background: #f0f9ff !important;
    }
    
    /* ===== 5. Reading Progress Bar ===== */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #1e40af, #3b82f6, #60a5fa);
      z-index: 9999;
      transition: width 0.2s;
    }
    
    /* ===== 6. Mobile Optimization ===== */
    @media (max-width: 768px) {
      .markdown-section h1 { font-size: 1.8rem; }
      .v5-cta-box { padding: 24px; }
      .v5-btn { 
        display: block; 
        margin: 8px 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="progress-bar"></div>
  
  <div id="app">🚀 Loading V5 Medical Knowledge Hub...</div>

  <script>
    window.$docsify = {
      // ===== 核心修复 =====
      // 1. 强制指定根目录
      basePath: '/blog/', 
      // 2. ❌ 删除 relativePath: true (它会导致路径错乱)
      // 3. 明确首页文件
      homepage: 'README.md',
      
      // ===== 其他配置保持不变 =====
      name: '<img src="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png" style="height:40px;vertical-align:middle;margin-right:8px;">V5 Medical',
      nameLink: 'https://v5md.com',
      repo: 'https://github.com/alden888/v5md',
      
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: true,
      onlyCover: false,
      routerMode: 'hash', 
      
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search insights...',
        depth: 6,
      },
      
      pagination: {
        previousText: '← Previous Strategy',
        nextText: 'Next Strategy →',
        crossChapter: true,
      },
      
      copyCode: {
        buttonText: 'Copy',
        successText: '✓ Copied'
      },
      
      // 插件部分保持原样...
      plugins: [
        // ... (保留您之前的插件代码)
      ]
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</body>
</html>
