<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Knowledge Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="canonical" href="https://v5md.com/blog/">
  <meta property="og:title" content="V5 Medical Knowledge Hub">
  <meta property="og:url" content="https://v5md.com/blog/">
  <meta property="og:image" content="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* =========================================
       1. 全局重置与变量 (匹配主站)
       ========================================= */
    :root { 
      --theme-color: #1e40af; 
      --theme-hover: #1e3a8a;
      --text-color: #334155;
      --header-height: 80px; /* 主站通常是 80px */
    }
    
    body { 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      color: var(--text-color);
      padding-top: var(--header-height); /* 给固定页眉留空间 */
      background-color: #f8fafc; /* 与主站背景协调 */
    }

    /* =========================================
       2. 复刻主站 Header (1:1 还原)
       ========================================= */
    #v5-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-height);
      z-index: 1000;
    }

    #navbar {
      position: fixed;
      width: 100%;
      z-index: 50;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      transition: all 0.3s;
      height: 80px;
    }

    #navbar .bg-gradient-to-r {
      background: linear-gradient(to right, #eff6ff, #2563eb, #1e3a8a);
    }

    .header-container {
      width: 100%;
      max-width: 1280px; /* 匹配 Tailwind max-w-7xl */
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      margin: 0 auto;
      position: relative;
    }

    /* Logo 区域 - 匹配主站样式 */
    .header-logo {
      display: flex;
      align-items: center;
      gap: 24px; /* 优化：增加logo和文字之间的间距，从12px改为24px，与主站保持一致 */
      text-decoration: none;
      position: relative;
      z-index: 10;
      padding-right: 8px;
    }
    .header-logo img { 
      height: 48px; 
      width: auto; 
    }
    .logo-text { 
      display: flex; 
      flex-direction: column; 
    }
    .brand-name { 
      font-size: 1.25rem; 
      font-weight: 800; 
      color: #1e3a8a; 
      line-height: 1; 
      letter-spacing: -0.025em; 
    }
    .brand-tag { 
      font-size: 0.65rem; 
      color: #1d4ed8; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      margin-top: 2px; 
    }

    /* 导航菜单 - 匹配主站样式 */
    .header-nav { 
      display: flex; 
      gap: 24px; 
      margin-left: 40px; 
      position: relative;
      z-index: 10;
    }
    .nav-link {
      text-decoration: none;
      color: #dbeafe; /* 主站蓝色背景下的文本颜色 */
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
      position: relative;
      padding-bottom: 1px;
    }
    .nav-link:hover { 
      color: white; 
    }
    .nav-link.active { 
      color: white; 
      font-weight: 700; 
      border-bottom: 2px solid #93c5fd;
    }

    /* 右侧按钮区 */
    .header-actions { 
      display: flex; 
      align-items: center; 
      gap: 16px; 
      position: relative;
      z-index: 10;
    }
    
    /* WhatsApp 按钮 (复刻主站风格) */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #22c55e; /* Tailwind green-500 */
      color: white;
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .btn-whatsapp:hover {
      background-color: #16a34a; /* Tailwind green-600 */
      transform: translateY(-1px);
    }

    /* 移动端菜单按钮 */
    .mobile-menu-btn {
      display: none;
      color: white;
      padding: 8px;
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
    }

    /* 移动端菜单 */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 80px;
      left: 0;
      width: 100%;
      background: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 999;
      border-top: 1px solid #e2e8f0;
    }

    .mobile-menu .nav-link {
      display: block;
      color: #475569;
      padding: 12px 24px;
      border-bottom: 1px solid #f1f5f9;
    }

    .mobile-menu .nav-link.active {
      color: #1e40af;
      background: #eff6ff;
      border-bottom: 1px solid #dbeafe;
    }

    /* 谷歌翻译样式调整 */
    #google_translate_element {
      position: fixed !important;
      z-index: 60 !important;
    }

    @media (min-width: 769px) {
      #google_translate_element { 
        top: 22px !important; 
        right: 20px !important; 
      }
    }

    @media (max-width: 768px) { 
      #google_translate_element { 
        top: 20px !important; 
        right: 60px !important; 
      }
      .goog-te-gadget-simple { 
        max-width: 120px !important; 
        padding: 4px !important; 
        font-size: 11px !important; 
      }
    }

    /* =========================================
       3. Docsify 布局适配
       ========================================= */
    .sidebar {
      top: var(--header-height) !important; /* 避开 Header */
      padding-top: 20px !important;
      background-color: #fff;
      border-right: 1px solid #f1f5f9;
      z-index: 900;
    }
    
    .content { padding-top: 20px; }
    
    /* 侧边栏开关按钮位置调整 */
    .sidebar-toggle {
      top: 95px !important; 
      left: 20px !important;
      background: transparent !important;
      color: var(--theme-color) !important;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .header-nav { display: none; } /* 手机端隐藏顶部导航 */
      .mobile-menu-btn { display: block; } /* 显示移动端菜单按钮 */
      .mobile-menu.active { display: block; } /* 激活时显示移动端菜单 */
      .btn-whatsapp span { display: none; } /* 手机端只显示图标 */
      .btn-whatsapp { padding: 8px; }
      .brand-tag { display: none; }
      .header-logo { gap: 16px; } /* 移动端适当减小间距 */
    }

    /* =========================================
       4. 文章样式微调 (保持之前的优化)
       ========================================= */
    .markdown-section { 
      max-width: 960px; 
      margin: 0 auto; 
      padding: 40px 40px 100px; 
      background: #fff;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); /* 给文章加个卡片阴影，更像主站 */
      border-radius: 8px;
      min-height: calc(100vh - 120px);
    }
    /* ... 保留之前的 CTA 和 Footer 样式 ... */
    .v5-cta-box { margin: 60px 0; padding: 40px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center; }
    .v5-btn { display: inline-block; background: #1e40af; color: white !important; padding: 12px 30px; border-radius: 50px; font-weight: 600; text-decoration: none; margin: 5px; }
    .v5-btn:hover { background: #1e3a8a; }
    .v5-btn-secondary { background: white; color: #1e40af !important; border: 1px solid #1e40af; }

    /* 移动端优化 */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 20px 20px 80px;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <div id="v5-header">
    <nav id="navbar" class="fixed w-full z-50 shadow-lg transition-all duration-300 h-20">
      <div class="absolute inset-0 bg-gradient-to-r from-blue-50 via-blue-600 to-blue-900"></div>
      
      <div class="header-container">
        <a href="https://v5md.com/" class="header-logo">
          <img src="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5logo.png" alt="V5 Medical LTD">
          <div class="logo-text">
            <span class="brand-name">V5 Medical LTD</span>
            <span class="brand-tag">Global Medical Supply Chain</span>
          </div>
        </a>

        <nav class="header-nav">
          <a href="https://v5md.com/" class="nav-link">Home</a>
          <a href="https://v5md.com/about.html" class="nav-link">About Us</a>
          <a href="https://v5md.com/catalog.html" class="nav-link">Products</a>
          <a href="#/" class="nav-link active">Blog</a>
          <a href="https://v5md.com/contact.html" class="nav-link">Contact</a>
        </nav>

        <div class="header-actions">
          <div id="google_translate_element"></div>
          
          <a href="https://wa.me/447895047944" target="_blank" class="btn-whatsapp">
            <i class="fab fa-whatsapp" style="font-size: 1.2rem;"></i>
            <span>Contact</span>
          </a>
          
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- 移动端菜单 -->
    <div class="mobile-menu" id="mobile-menu">
      <a href="https://v5md.com/" class="nav-link">Home</a>
      <a href="https://v5md.com/about.html" class="nav-link">About Us</a>
      <a href="https://v5md.com/catalog.html" class="nav-link">Products</a>
      <a href="#/" class="nav-link active">Blog</a>
      <a href="https://v5md.com/contact.html" class="nav-link">Contact</a>
      <div class="p-4 bg-gray-50">
        <a href="https://wa.me/447895047944" target="_blank" class="btn-whatsapp" style="display: block; text-align: center; margin: 0 auto;">
          <i class="fab fa-whatsapp"></i> Contact via WhatsApp
        </a>
      </div>
    </div>
  </div>

  <div id="app">🚀 Loading Knowledge Hub...</div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    window.$docsify = {
      basePath: 'https://raw.githubusercontent.com/alden888/v5md/main/blog/',
      encoding: 'utf-8',
      nameLink: 'https://v5md.com',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: false, // 关掉原生导航，用我们手写的 Header
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false, 
      routerMode: 'hash',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search insights...',
        depth: 6,
      },
      plugins: [
        function(hook) {
          // 渲染前过滤
          hook.beforeEach(function(content, url) {
            if (url && url.endsWith('.md')) {
              return content
                .replace(/<script[\s\S]*?<\/script>/gi, '') 
                .replace(/<style[\s\S]*?<\/style>/gi, '')   
                .replace(/[\u0000-\u001F\u007F]/g, '')
                .replace(/^\*\*|^\#+/gm, '') 
                .replace(/^\-\-\-/gm, '');
            }
            return content;
          });
          
          // 渲染后加 CTA
          hook.afterEach(function(html) {
            return html + `
              <div class="v5-cta-box">
                <h3>🎯 Ready to Optimize?</h3>
                <p>Download our Capability Statement for details.</p>
                <a href="/pdf/V5_Medical_Capability_Statement.pdf" target="_blank" class="v5-btn">Download PDF</a>
                <a href="/contact.html" class="v5-btn v5-btn-secondary">Contact Sales</a>
              </div>
              <footer style="text-align:center;margin-top:40px;color:#94a3b8;font-size:0.85rem;">
                &copy; 2025 V5 Medical LTD | ISO 13485 Certified Framework
              </footer>
            `;
          });
        }
      ]
    }
  </script>

  <script>
    // 移动端菜单功能
    document.addEventListener('DOMContentLoaded', function() {
      const menuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      
      if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', function() {
          mobileMenu.classList.toggle('active');
          const icon = menuBtn.querySelector('i');
          if (mobileMenu.classList.contains('active')) {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-times');
          } else {
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
          }
        });
        
        // 点击菜单外区域关闭菜单
        document.addEventListener('click', function(e) {
          if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target) && mobileMenu.classList.contains('active')) {
            mobileMenu.classList.remove('active');
            const icon = menuBtn.querySelector('i');
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
          }
        });
      }
    });
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
