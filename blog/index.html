<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V5 Medical Knowledge Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="canonical" href="https://v5md.com/blog/">
  <meta property="og:title" content="V5 Medical Knowledge Hub">
  <meta property="og:url" content="https://v5md.com/blog/">
  <meta property="og:image" content="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* =========================================
       1. 全局配置
       ========================================= */
    :root { 
      --theme-color: #1e40af; 
      --theme-hover: #1e3a8a;
      --text-color: #334155;
      --header-height: 72px; /* 调整为更精致的高度 */
    }
    
    body { 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      color: var(--text-color);
      padding-top: var(--header-height);
      background-color: #f8fafc;
    }

    /* =========================================
       2. 导航栏 (V5 Header) - 修正版
       ========================================= */
    #v5-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-height);
      z-index: 1000;
      background: #ffffff; /* 修正：改为白底，更专业 */
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .header-container {
      width: 100%;
      max-width: 1280px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      margin: 0 auto;
    }

    /* Logo 区域 - 尺寸修正 */
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px; /* 修正：从 24px 改回标准的 12px */
      text-decoration: none;
    }
    
    .header-logo img { 
      height: 40px; /* 修正：从 48px 改为 40px，更精致 */
      width: auto; 
    }
    
    .logo-text { 
      display: flex; 
      flex-direction: column; 
    }
    
    .brand-name { 
      font-size: 1.15rem; /* 微调字体大小 */
      font-weight: 800; 
      color: #1e3a8a; /* 深蓝文字在白底上很清晰 */
      line-height: 1; 
      letter-spacing: -0.02em; 
    }
    
    .brand-tag { 
      font-size: 0.65rem; 
      color: #64748b; /* 灰色副标题 */
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      margin-top: 2px; 
    }

    /* 导航菜单 - 颜色修正 */
    .header-nav { 
      display: flex; 
      gap: 32px; 
      margin-left: 40px; 
    }
    
    .nav-link {
      text-decoration: none;
      color: #475569; /* 修正：深灰色文字 */
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
      position: relative;
      padding: 4px 0;
    }
    
    .nav-link:hover { 
      color: var(--theme-color); 
    }
    
    .nav-link.active { 
      color: var(--theme-color); 
      font-weight: 700; 
    }
    /* 激活态下划线 */
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--theme-color);
      border-radius: 2px;
    }

    /* 右侧按钮区 */
    .header-actions { 
      display: flex; 
      align-items: center; 
      gap: 16px; 
    }
    
    /* WhatsApp 按钮 */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #22c55e;
      color: white;
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 2px 4px rgba(34, 197, 94, 0.2);
      transition: all 0.2s;
    }
    .btn-whatsapp:hover {
      background-color: #16a34a;
      transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(34, 197, 94, 0.3);
    }

    /* 移动端菜单按钮 */
    .mobile-menu-btn {
      display: none;
      color: #334155; /* 深色图标 */
      padding: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
    }

    /* 移动端菜单面板 */
    .mobile-menu {
      display: none;
      position: fixed;
      top: var(--header-height);
      left: 0;
      width: 100%;
      background: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 999;
      border-top: 1px solid #e2e8f0;
    }
    .mobile-menu.active { display: block; }
    
    .mobile-menu .nav-link {
      display: block;
      padding: 14px 24px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }
    .mobile-menu .nav-link.active {
      color: var(--theme-color);
      background: #eff6ff;
    }

    /* 谷歌翻译 */
    #google_translate_element { margin-right: 10px; }
    .goog-te-gadget-simple {
      background-color: #f8fafc !important;
      border: 1px solid #e2e8f0 !important;
      padding: 6px 10px !important;
      border-radius: 6px !important;
    }

    /* =========================================
       3. Docsify 布局适配
       ========================================= */
    .sidebar {
      top: var(--header-height) !important;
      padding-top: 20px !important;
      background-color: #fff;
      border-right: 1px solid #e2e8f0;
      z-index: 900;
    }
    
    .sidebar-toggle {
      top: 85px !important; 
      left: 20px !important;
      background: transparent !important;
      color: var(--theme-color) !important;
    }

    /* =========================================
       4. 响应式适配
       ========================================= */
    @media (max-width: 768px) {
      .header-nav { display: none; }
      .mobile-menu-btn { display: block; }
      .btn-whatsapp span { display: none; }
      .btn-whatsapp { padding: 8px; border-radius: 50%; width: 36px; height: 36px; justify-content: center; }
      .brand-tag { display: none; }
      #google_translate_element { display: none; }
      .header-logo { gap: 10px; }
      .header-logo img { height: 32px; }
      .brand-name { font-size: 1rem; }
    }

    /* =========================================
       5. 内容区样式 (美化)
       ========================================= */
    .markdown-section { 
      max-width: 960px; 
      margin: 0 auto; 
      padding: 40px 40px 100px; 
      background: #fff;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      min-height: calc(100vh - 120px);
    }
    
    /* 其他组件样式保持不变... */
    .v5-cta-box { margin: 60px 0; padding: 40px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center; }
    .v5-cta-box h3 { font-size: 1.6rem; color: var(--theme-color); margin-bottom: 15px; }
    .v5-btn { display: inline-block; background: #1e40af; color: white !important; padding: 12px 30px; border-radius: 50px; font-weight: 600; text-decoration: none; margin: 5px; transition: all 0.2s; }
    .v5-btn:hover { background: #1e3a8a; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .v5-btn-secondary { background: white; color: #1e40af !important; border: 2px solid #1e40af; }
    #progress-bar { position: fixed; top: var(--header-height); left: 0; height: 3px; background: var(--theme-color); z-index: 100000; transition: width 0.2s; }
    
    @media (max-width: 768px) {
      .markdown-section { padding: 25px 20px 80px; box-shadow: none; }
      .v5-btn { display: block; width: 100%; }
    }
  </style>
</head>

<body>
  <div id="v5-header">
    <div class="header-container">
      <a href="https://v5md.com/" class="header-logo">
        <img src="https://pub-224e4e74685e409e833e89d4ab5143fb.r2.dev/v5medlogo.png" alt="V5 Medical">
        <div class="logo-text">
          <span class="brand-name">V5 Medical LTD</span>
          <span class="brand-tag">Global Supply Chain</span>
        </div>
      </a>

      <nav class="header-nav">
        <a href="https://v5md.com/" class="nav-link">Home</a>
        <a href="https://v5md.com/about.html" class="nav-link">About Us</a>
        <a href="https://v5md.com/catalog.html" class="nav-link">Products</a>
        <a href="#/" class="nav-link active">Blog</a>
        <a href="https://v5md.com/contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="header-actions">
        <div id="google_translate_element"></div>
        
        <a href="https://wa.me/447895047944" target="_blank" class="btn-whatsapp">
          <i class="fab fa-whatsapp" style="font-size: 1.1rem;"></i>
          <span>Contact</span>
        </a>
        
        <button class="mobile-menu-btn" id="mobile-menu-btn">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>

    <div class="mobile-menu" id="mobile-menu">
      <a href="https://v5md.com/" class="nav-link">Home</a>
      <a href="https://v5md.com/about.html" class="nav-link">About Us</a>
      <a href="https://v5md.com/catalog.html" class="nav-link">Products</a>
      <a href="#/" class="nav-link active">Blog</a>
      <a href="https://v5md.com/contact.html" class="nav-link">Contact</a>
    </div>
  </div>

  <div id="progress-bar"></div>
  <div id="app">🚀 Loading Knowledge Hub...</div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    window.$docsify = {
      basePath: 'https://raw.githubusercontent.com/alden888/v5md/main/blog/',
      encoding: 'utf-8',
      nameLink: 'https://v5md.com',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false, 
      routerMode: 'hash',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search insights...',
        depth: 6,
      },
      plugins: [
        function(hook) {
          hook.beforeEach(function(content, url) {
            if (url && url.endsWith('.md')) {
              return content
                .replace(/<script[\s\S]*?<\/script>/gi, '') 
                .replace(/<style[\s\S]*?<\/style>/gi, '')   
                .replace(/[\u0000-\u001F\u007F]/g, '')
                .replace(/^\*\*|^\#+/gm, '') 
                .replace(/^\-\-\-/gm, '');
            }
            return content;
          });
          
          hook.afterEach(function(html) {
            return html + `
              <div class="v5-cta-box">
                <h3>🎯 Ready to Optimize?</h3>
                <p>Download our Capability Statement for details.</p>
                <a href="/pdf/V5_Medical_Capability_Statement.pdf" target="_blank" class="v5-btn">Download PDF</a>
                <a href="/contact.html" class="v5-btn v5-btn-secondary">Contact Sales</a>
              </div>
              <footer style="text-align:center;margin-top:40px;color:#94a3b8;font-size:0.85rem;">
                &copy; 2025 V5 Medical LTD | ISO 13485 Certified Framework
              </footer>
            `;
          });
        }
      ]
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const menuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      
      if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', function() {
          mobileMenu.classList.toggle('active');
          const icon = menuBtn.querySelector('i');
          if (mobileMenu.classList.contains('active')) {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-times');
          } else {
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
          }
        });
        
        document.addEventListener('click', function(e) {
          if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target) && mobileMenu.classList.contains('active')) {
            mobileMenu.classList.remove('active');
            menuBtn.querySelector('i').classList.replace('fa-times', 'fa-bars');
          }
        });
      }
    });
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
</body>
</html>
