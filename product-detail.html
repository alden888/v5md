<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | V5 Medical LTD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='index.html'">
                <img src="https://raw.githubusercontent.com/alden888/v5md/main/images/logo/v5logo.png" class="h-12" alt="V5 Medical" />
                <div>
                    <div class="font-bold text-xl text-blue-900">V5 Medical LTD</div>
                    <div class="text-xs text-blue-600">Global Medical Supplier</div>
                </div>
            </div>
            <div class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="font-medium text-gray-600 hover:text-blue-900">Home</a>
                <a href="catalog.html" class="font-medium text-blue-900">Products</a>
                <a href="about.html" class="font-medium text-gray-600 hover:text-blue-900">About</a>
                <a href="contact.html" class="font-medium text-gray-600 hover:text-blue-900">Contact</a>
                <a href="https://wa.me/447895047944" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-full font-semibold flex items-center">
                    <i class="fab fa-whatsapp mr-2"></i> WhatsApp
                </a>
            </div>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <section class="pt-32 pb-8 bg-white">
        <div class="max-w-7xl mx-auto px-4">
            <nav class="flex items-center text-sm text-gray-600">
                <a href="index.html" class="hover:text-blue-600">Home</a>
                <i class="fas fa-chevron-right mx-2 text-xs"></i>
                <a href="catalog.html" class="hover:text-blue-600">Products</a>
                <i class="fas fa-chevron-right mx-2 text-xs"></i>
                <span id="breadcrumb-category" class="text-blue-600">Loading...</span>
                <i class="fas fa-chevron-right mx-2 text-xs"></i>
                <span id="breadcrumb-product" class="text-gray-900">Product Details</span>
            </nav>
        </div>
    </section>

    <!-- Product Details -->
    <section class="max-w-7xl mx-auto px-4 pb-20">
        <div id="product-container" class="grid md:grid-cols-2 gap-12">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20">
                <div class="inline-block w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-xl text-gray-600">Loading product details...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12 text-center">
        <div class="max-w-7xl mx-auto px-4">
            <p class="text-gray-400 mb-4">© 2025 V5 Medical LTD. All rights reserved.</p>
        </div>
    </footer>

    <!-- WhatsApp Float Button -->
    <a href="https://wa.me/447895047944" target="_blank" class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center z-50">
        <i class="fab fa-whatsapp text-2xl"></i>
    </a>

    <script src="https://raw.githubusercontent.com/alden888/v5md/main/js/products.js"></script>
    <script>
        console.log('[Product Detail] Page loaded');

        // Get product ID from URL
        function getProductId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // Category names
        const categoryNames = {
            'surgical-sutures': 'Surgical Sutures',
            'surgical-instruments': 'Surgical Instruments',
            'gauze-dressings': 'Gauze Dressings',
            'protective-equipment': 'Protective Equipment',
            'injection-infusion': 'Injection & Infusion',
            'dental-products': 'Dental Products',
            'surgical-packs': 'Surgical Packs'
        };

        // Load product details
        function loadProductDetails() {
            console.log('[Product Detail] Loading details...');
            
            const productId = getProductId();
            if (!productId) {
                showError('No product ID provided in URL.');
                return;
            }
            
            console.log('[Product Detail] Product ID:', productId);
            
            // Check database
            const db = window.productDatabase || window.finalProductDatabase;
            if (!db) {
                console.error('[Product Detail] Product database not loaded!');
                showError('Product database failed to load.');
                return;
            }
            
            const product = db[productId];
            if (!product) {
                console.error('[Product Detail] Product not found:', productId);
                showError('Product not found.');
                return;
            }
            
            console.log('[Product Detail] Product found:', product.name);
            displayProduct(product);
        }

        function displayProduct(product) {
            // Update breadcrumb
            document.getElementById('breadcrumb-category').textContent = categoryNames[product.category] || product.category;
            document.getElementById('breadcrumb-product').textContent = product.name;
            
            // Update page title
            document.title = `${product.name} | V5 Medical LTD`;
            
            // Display product
            const container = document.getElementById('product-container');
            container.innerHTML = `
                <!-- Product Images -->
                <div>
                    <div class="bg-white rounded-xl shadow-lg p-8 mb-6">
                        <img id="main-image" 
                             src="${product.images[0]}" 
                             alt="${product.name}"
                             class="w-full h-96 object-contain"
                             onerror="this.src='https://via.placeholder.com/800x600?text=No+Image'">
                    </div>
                    ${product.images.length > 1 ? `
                    <div class="grid grid-cols-4 gap-4">
                        ${product.images.map((img, idx) => `
                            <img src="${img}" 
                                 alt="${product.name} ${idx + 1}"
                                 class="w-full h-24 object-cover rounded-lg cursor-pointer hover:opacity-75 transition ${idx === 0 ? 'ring-2 ring-blue-600' : ''}"
                                 onclick="changeMainImage('${img}', this)"
                                 onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                        `).join('')}
                    </div>
                    ` : ''}
                </div>

                <!-- Product Info -->
                <div>
                    <h1 class="text-3xl font-bold mb-4">${product.name}</h1>
                    <p class="text-gray-600 text-lg mb-6">${product.short}</p>
                    
                    <!-- Price & Availability -->
                    <div class="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-lg p-6 mb-6">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-gray-600 font-medium">Price:</span>
                            <span class="text-2xl font-bold text-blue-600">${product.price}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600 font-medium">Availability:</span>
                            <span class="text-green-600 font-medium">${product.availability}</span>
                        </div>
                    </div>

                    <!-- Certifications -->
                    <div class="flex gap-4 mb-6">
                        ${product.certifications.map(cert => `
                            <span class="bg-blue-100 text-blue-800 px-4 py-2 rounded-lg font-medium">${cert}</span>
                        `).join('')}
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-4 mb-8">
                        <a href="https://wa.me/447895047944?text=I'm interested in ${encodeURIComponent(product.name)}" 
                           target="_blank"
                           class="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 px-6 rounded-lg font-medium text-center flex items-center justify-center gap-2">
                            <i class="fab fa-whatsapp"></i>
                            Get Price Now
                        </a>
                        <a href="mailto:sales@v5md.com?subject=Inquiry about ${encodeURIComponent(product.name)}" 
                           class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded-lg font-medium text-center flex items-center justify-center gap-2">
                            <i class="fas fa-envelope"></i>
                            Email Inquiry
                        </a>
                    </div>

                    <!-- Description -->
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-xl font-bold mb-4">Product Description</h2>
                        <p class="text-gray-600 leading-relaxed">${product.description}</p>
                    </div>
                </div>
            `;
        }

        function changeMainImage(imageUrl, thumbElement) {
            const mainImage = document.getElementById('main-image');
            mainImage.src = imageUrl;
            
            // Update thumbnail borders
            document.querySelectorAll('#product-container img[onclick]').forEach(img => {
                img.classList.remove('ring-2', 'ring-blue-600');
            });
            thumbElement.classList.add('ring-2', 'ring-blue-600');
        }

        function showError(message) {
            const container = document.getElementById('product-container');
            container.innerHTML = `
                <div class="col-span-full text-center py-20">
                    <i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-4"></i>
                    <p class="text-xl text-gray-800 mb-2">Error Loading Product</p>
                    <p class="text-gray-600 mb-4">${message}</p>
                    <a href="catalog.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg">
                        Back to Catalog
                    </a>
                </div>
            `;
        }

        // Wait for database
        let checkCount = 0;
        const checkDatabase = setInterval(() => {
            checkCount++;
            console.log('[Product Detail] Check', checkCount, '- Database available:', !!(window.productDatabase || window.finalProductDatabase));
            
            if (window.productDatabase || window.finalProductDatabase) {
                clearInterval(checkDatabase);
                loadProductDetails();
            } else if (checkCount > 20) {
                clearInterval(checkDatabase);
                showError('Product database failed to load after 20 attempts.');
            }
        }, 250);
    </script>
</body>
</html>
