<!-- 在product-detail.html的<head>部分添加 -->
<script src="js/product-loader.js"></script>
<script src="js/complete-products.js"></script>

<!-- 修改product-detail.html的JavaScript部分 -->
<script>
    async function loadProduct() {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        if (!productId) {
            showNoProductSelected();
            return;
        }
        
        try {
            // 使用统一的产品加载器
            const db = await window.productLoader.loadProducts();
            const product = db.byId[productId];
            
            if (!product) {
                showProductNotFound(productId);
                return;
            }
            
            // 渲染产品详情
            renderProductDetail(product);
            
        } catch (error) {
            console.error('Error loading product:', error);
            showProductNotFound(productId);
        }
    }
</script>
