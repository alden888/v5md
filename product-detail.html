                document.getElementById('main-content').innerHTML = `
                    <div class="text-center py-20">
                        <i class="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
                        <h2 class="text-2xl font-bold mb-2">No Product Selected</h2>
                        <p class="text-gray-600 mb-6">Please select a product from our catalog.</p>
                        <a href="catalog.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg">
                            Browse Catalog
                        </a>
                    </div>
                `;
                return;
            }

            console.log('Looking for product:', productId);
            console.log('Available products:', Object.keys(PRODUCTS));
            
            const product = PRODUCTS[productId];
            
            if (!product) {
                document.getElementById('main-content').innerHTML = `
                    <div class="text-center py-20">
                        <i class="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
                        <h2 class="text-2xl font-bold mb-2">Product Not Found</h2>
                        <p class="text-gray-600 mb-6">Product ID: ${productId}</p>
                        <p class="text-gray-600 mb-6">Available products: ${Object.keys(PRODUCTS).join(', ')}</p>
                        <a href="catalog.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg">
                            Browse Catalog
                        </a>
                    </div>
                `;
                return;
            }

            renderProductDetail(product);
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', loadProduct);
