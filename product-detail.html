<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V5 Medical Product Detail | Premium Medical Consumables</title>
    
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/alden888/v5md/main/images/icons/favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        primary: '#1e40af', 
                        secondary: '#3b82f6', 
                        accent: '#2563eb'
                    }
                }
            }
        }
    </script>
    
    <style>
        .product-gallery-thumb { 
            transition: all 0.3s ease; 
            border: 2px solid transparent;
            cursor: pointer;
        }
        .product-gallery-thumb.active { 
            border-color: #1e40af; 
            opacity: 1;
        }
        .product-gallery-thumb:hover { 
            opacity: 0.8; 
        }
        .product-tab {
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }
        .product-tab.active {
            border-bottom-color: #1e40af;
            color: #1e40af;
            font-weight: 600;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .product-not-found {
            text-align: center;
            padding: 4rem 2rem;
        }
    </style>
</head>

<body class="font-sans text-gray-800 bg-gray-50">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='index.html'">
                <img src="https://raw.githubusercontent.com/alden888/v5md/main/images/logo/v5logo.png" 
                     class="h-12" 
                     alt="V5 Medical"
                     onerror="this.style.display='none'">
                <div>
                    <div class="font-bold text-xl text-blue-900">V5 Medical LTD</div>
                    <div class="text-xs text-blue-600">Global Medical Supplier</div>
                </div>
            </div>
            <div class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="font-medium text-gray-600 hover:text-blue-900 transition">Home</a>
                <a href="catalog.html" class="font-medium text-blue-900 border-b-2 border-blue-900">Products</a>
                <a href="about.html" class="font-medium text-gray-600 hover:text-blue-900 transition">About</a>
                <a href="contact.html" class="font-medium text-gray-600 hover:text-blue-900 transition">Contact</a>
            </div>
            <button id="mobile-menu-btn" class="md:hidden text-gray-800">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="bg-gray-100 pt-32 pb-4 border-b">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center text-sm text-gray-600">
                <a href="index.html" class="hover:text-blue-600">Home</a>
                <i class="fas fa-chevron-right mx-2 text-xs"></i>
                <a href="catalog.html" class="hover:text-blue-600">Products</a>
                <i class="fas fa-chevron-right mx-2 text-xs"></i>
                <span id="breadcrumb-category">Category</span>
                <i class="fas fa-chevron-right mx-2 text-xs"></i>
                <span id="breadcrumb-product" class="text-blue-600 font-medium">Product</span>
            </div>
        </div>
    </div>

    <!-- Product Content -->
    <div id="product-content" class="max-w-7xl mx-auto px-4 py-12">
        <div class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
            <p class="mt-4 text-gray-600">Loading product details...</p>
        </div>
    </div>

    <!-- Related Products -->
    <div id="related-products" class="bg-gray-50 py-16 hidden">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-2xl font-bold text-center mb-12">Related Products</h2>
            <div id="related-products-grid" class="grid md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12">
        <div class="max-w-7xl mx-auto text-center">
            <p class="text-2xl font-bold mb-4">Ready for Your Next Order?</p>
            <p class="text-gray-400 mb-6">© 2025 V5 Medical LTD. All rights reserved.</p>
        </div>
    </footer>

    <!-- WhatsApp Float -->
    <a href="https://wa.me/447895047944" target="_blank" class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center z-50 transition hover:scale-110">
        <i class="fab fa-whatsapp text-2xl"></i>
    </a>

    <script>
        // 加载产品数据库
        function loadProductDatabase() {
            return new Promise((resolve, reject) => {
                // 检查是否已加载
                if (window.productDatabase) {
                    resolve(window.productDatabase);
                    return;
                }

                // 动态加载 products.js
                const script = document.createElement('script');
                script.src = 'js/products.js';
                script.onload = () => {
                    if (window.productDatabase) {
                        resolve(window.productDatabase);
                    } else {
                        reject(new Error('Product database not found'));
                    }
                };
                script.onerror = () => reject(new Error('Failed to load product database'));
                document.head.appendChild(script);
            });
        }

        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function showNoProductSelected() {
            document.getElementById('product-content').innerHTML = `
                <div class="product-not-found">
                    <i class="fas fa-box-open text-blue-600 text-6xl mb-4"></i>
                    <h2 class="text-2xl font-bold mb-2">No Product Selected</h2>
                    <p class="text-gray-600 mb-6">Please select a product from our catalog.</p>
                    <a href="catalog.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg">
                        Browse Catalog
                    </a>
                </div>
            `;
        }

        function showProductNotFound(productId) {
            document.getElementById('product-content').innerHTML = `
                <div class="product-not-found">
                    <i class="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
                    <h2 class="text-2xl font-bold mb-2">Product Not Found</h2>
                    <p class="text-gray-600 mb-6">Product ID "${productId}" does not exist.</p>
                    <a href="catalog.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg">
                        Browse Catalog
                    </a>
                </div>
            `;
        }

        function updateBreadcrumb(product) {
            const categories = {
                'surgical-sutures': 'Surgical Sutures',
                'surgical-instruments': 'Surgical Instruments',
                'gauze-dressings': 'Gauze Dressings',
                'protective-equipment': 'Protective Equipment',
                'injection-infusion': 'Injection & Infusion',
                'dental-products': 'Dental Products',
                'surgical-packs': 'Surgical Packs'
            };
            
            document.getElementById('breadcrumb-category').textContent = categories[product.category] || product.category;
            document.getElementById('breadcrumb-product').textContent = product.name;
        }

        function switchTab(tabName) {
            // 更新标签页状态
            document.querySelectorAll('.product-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        function renderProductContent(product) {
            // 构建产品详情HTML
            const html = `
                <div class="grid lg:grid-cols-2 gap-12">
                    <div>
                        <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
                            <img id="mainImage" src="${product.images[0] || 'https://via.placeholder.com/600x400?text=Product+Image'}" 
                                 class="w-full h-96 object-contain rounded-lg">
                        </div>
                        
                        ${product.images.length > 1 ? `
                        <div class="grid grid-cols-4 gap-3">
                            ${product.images.map((img, i) => `
                                <img src="${img}" 
                                     onerror="this.src='https://via.placeholder.com/150?text=Image'" 
                                     class="product-gallery-thumb ${i===0?'active':''} w-full h-24 object-cover rounded-lg cursor-pointer"
                                     onclick="document.getElementById('mainImage').src=this.src; 
                                              document.querySelectorAll('.product-gallery-thumb').forEach(t=>t.classList.remove('active')); 
                                              this.classList.add('active');">
                            `).join('')}
                        </div>
                        ` : ''}
                        
                        <div class="bg-white rounded-xl shadow-sm p-6 mt-6">
                            <h3 class="font-bold text-lg mb-4">Certifications</h3>
                            <div class="grid grid-cols-3 gap-4">
                                <div class="bg-blue-50 p-4 rounded-lg text-center">
                                    <img src="https://raw.githubusercontent.com/alden888/v5md/main/images/quality/ce-mark.png" 
                                         onerror="this.src='https://via.placeholder.com/80?text=CE'" 
                                         class="w-16 h-16 mx-auto mb-2 object-contain">
                                    <span class="text-xs font-semibold">CE Mark</span>
                                </div>
                                <div class="bg-green-50 p-4 rounded-lg text-center">
                                    <img src="https://raw.githubusercontent.com/alden888/v5md/main/images/quality/iso13485-2016.jpg" 
                                         onerror="this.src='https://via.placeholder.com/80?text=ISO'" 
                                         class="w-16 h-16 mx-auto mb-2 object-contain">
                                    <span class="text-xs font-semibold">ISO 13485</span>
                                </div>
                                <div class="bg-red-50 p-4 rounded-lg text-center">
                                    <img src="https://raw.githubusercontent.com/alden888/v5md/main/images/quality/fda.jpg" 
                                         onerror="this.src='https://via.placeholder.com/80?text=FDA'" 
                                         class="w-16 h-16 mx-auto mb-2 object-contain">
                                    <span class="text-xs font-semibold">FDA</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <h1 class="text-3xl font-bold mb-2">${product.name}</h1>
                        <div class="flex items-center gap-3 mb-6">
                            <div class="bg-green-500 text-white text-xs px-3 py-1 rounded-full font-semibold">
                                ${product.availability}
                            </div>
                            <div class="text-sm text-gray-600">Stock: ${product.stockLevel || 'Available'}</div>
                        </div>
                        
                        <div class="bg-gray-50 p-4 rounded-lg mb-6">
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="font-semibold">Key Features</h3>
                                <span class="text-blue-600 font-bold text-xl">${product.price}</span>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${product.certifications.map(cert => 
                                    `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs">${cert}</span>`
                                ).join('')}
                            </div>
                        </div>
                        
                        <div class="border-b mb-6">
                            <div class="flex gap-8">
                                <div class="product-tab active py-4" onclick="switchTab('description')">Description</div>
                                <div class="product-tab py-4" onclick="switchTab('specifications')">Specifications</div>
                            </div>
                        </div>
                        
                        <div id="description" class="tab-content active">
                            <p class="text-gray-700 leading-relaxed mb-4">${product.short}</p>
                            <p class="text-gray-700 leading-relaxed">${product.description}</p>
                        </div>
                        
                        <div id="specifications" class="tab-content">
                            ${product.specifications ? Object.entries(product.specifications).map(([key, value]) => 
                                `<div class="flex justify-between py-3 border-b">
                                    <span class="text-gray-600">${key}</span>
                                    <span class="font-semibold">${value}</span>
                                </div>`
                            ).join('') : '<p class="text-gray-600">No specifications available.</p>'}
                        </div>
                        
                        <div class="mt-8 flex gap-4">
                            <a href="catalog.html" 
                               class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg text-center transition">
                                <i class="fas fa-arrow-left mr-2"></i> Back to Catalog
                            </a>
                            <a href="https://wa.me/447895047944?text=I'm interested in ${encodeURIComponent(product.name)}" 
                               target="_blank"
                               class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg text-center transition">
                                <i class="fab fa-whatsapp mr-2"></i> Inquire on WhatsApp
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('product-content').innerHTML = html;
        }

        function renderRelatedProducts(product) {
            const container = document.getElementById('related-products');
            const grid = document.getElementById('related-products-grid');
            
            // 获取同类别产品
            const relatedProducts = window.productDatabase.products
                .filter(p => p.category === product.category && p.id !== product.id)
                .slice(0, 4);
            
            if (relatedProducts.length > 0) {
                grid.innerHTML = relatedProducts.map(p => `
                    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition">
                        <img src="${p.images[0] || 'https://via.placeholder.com/300x200?text=Product'}" 
                             class="w-full h-48 object-cover"
                             onerror="this.src='https://via.placeholder.com/300x200?text=Product'">
                        <div class="p-4">
                            <h3 class="font-bold text-lg mb-2">${p.name}</h3>
                            <p class="text-gray-600 text-sm mb-3 line-clamp-2">${p.short}</p>
                            <a href="product-detail.html?id=${p.id}" 
                               class="block text-center bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm">
                                View Details
                            </a>
                        </div>
                    </div>
                `).join('');
                
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        async function loadProduct() {
            const productId = getUrlParameter('id');
            
            if (!productId) {
                showNoProductSelected();
                return;
            }
            
            try {
                // 加载产品数据库
                const db = await loadProductDatabase();
                
                // 查找产品
                const product = db.byId[productId] || db.products.find(p => p.id === productId);
                
                if (!product) {
                    showProductNotFound(productId);
                    return;
                }
                
                updateBreadcrumb(product);
                renderProductContent(product);
                renderRelatedProducts(product);
                
            } catch (error) {
                console.error('Error loading product:', error);
                showProductNotFound(productId);
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            loadProduct();
            
            // 移动菜单切换
            document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
                const menu = document.getElementById('mobile-menu');
                if (menu) {
                    menu.classList.toggle('hidden');
                }
            });
        });
    </script>
</body>
</html>
