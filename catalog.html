<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="V5 Medical Product Catalog - ISO 13485, CE & FDA certified medical consumables">
    <title>Product Catalog | V5 Medical LTD</title>
    <link rel="icon" type="image/x-icon" href="images/icons/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e40af', secondary: '#3b82f6' }
                }
            }
        }
    </script>
    <style>
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .loading-spinner {
            border: 3px solid #f3f4f6; border-top: 3px solid #3b82f6; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <div id="v5-header"></div>

    <main class="flex-grow pt-20"> <section class="bg-gradient-to-r from-blue-900 to-blue-700 text-white py-16 relative overflow-hidden">
            <div class="max-w-7xl mx-auto px-4 text-center relative z-10">
                <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">Medical Products Catalog</h1>
                <p class="text-xl opacity-90 font-light">ISO 13485, CE & FDA Certified Medical Consumables</p>
            </div>
        </section>

        <section class="bg-white py-4 sticky top-20 z-40 shadow-sm border-b border-gray-100">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex flex-wrap gap-3 justify-center" id="category-filters">
                    <button class="category-badge px-6 py-2 rounded-full bg-blue-600 text-white font-semibold shadow-sm" data-category="all">
                        All Products (<span id="count-all">0</span>)
                    </button>
                    </div>
            </div>
        </section>

        <div id="loading" class="text-center py-20">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-gray-600">Loading catalog...</p>
        </div>
        <div id="error" class="hidden text-center py-20">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h2 class="text-2xl font-bold mb-2">Unable to Load Products</h2>
            <button onclick="retryLoading()" class="text-blue-600 hover:underline">Retry</button>
        </div>

        <section class="max-w-7xl mx-auto px-4 py-12">
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
            <div id="no-results" class="hidden text-center py-20">
                <p class="text-gray-500 text-xl">No products found in this category.</p>
                <button onclick="resetFilters()" class="mt-4 text-blue-600 font-semibold">View All</button>
            </div>
        </section>
    </main>

    <div id="v5-footer"></div>

    <script src="js/layout.js"></script>
    
    <script src="js/complete-products.js"></script>
    <script src="js/product-loader.js"></script>

    <script>
        // 变量定义
        let currentCategory = 'all';
        let allProducts = [];
        let categoryCounts = {};

        function initLoader() {
            if (!window.productLoader) {
                if (typeof ProductLoader === 'undefined') {
                    console.error('ProductLoader class not found.'); return;
                }
                window.productLoader = new ProductLoader();
                window.addEventListener('productLoadError', handleLoadError);
            }
        }

        function initializeCatalog() {
            initLoader();
            if (window.productLoader) {
                window.productLoader.loadProducts()
                    .then(handleProductsLoaded)
                    .catch(handleLoadError);
            }
        }

        function handleProductsLoaded(database) {
            allProducts = database.products || Object.values(database.byId) || [];
            if (!allProducts.length) throw new Error('No products found');
            
            generateCategoryFilters();
            renderProducts(allProducts);
            document.getElementById('loading').classList.add('hidden');
            handleUrlHash();
        }

        function generateCategoryFilters() {
            const filterContainer = document.getElementById('category-filters');
            if (!filterContainer) return;

            categoryCounts = { 'all': allProducts.length };
            allProducts.forEach(p => {
                const c = p.category || 'uncategorized';
                categoryCounts[c] = (categoryCounts[c] || 0) + 1;
            });

            const categories = window.completeProductDatabase?.categories || {};
            filterContainer.innerHTML = '';
            
            // All Button
            const allBtn = createFilterBtn('All Products', 'all', categoryCounts['all'], true);
            filterContainer.appendChild(allBtn);

            // Category Buttons
            Object.keys(categories).forEach(cat => {
                if (!categoryCounts[cat]) return;
                filterContainer.appendChild(createFilterBtn(categories[cat], cat, categoryCounts[cat], false));
            });
        }

        function createFilterBtn(label, cat, count, isActive) {
            const btn = document.createElement('button');
            btn.className = isActive 
                ? 'category-badge px-6 py-2 rounded-full bg-blue-600 text-white font-semibold shadow-md transition-all'
                : 'category-badge px-6 py-2 rounded-full bg-white text-gray-700 font-semibold shadow-sm hover:bg-gray-50 border border-gray-200 transition-all';
            btn.dataset.category = cat;
            btn.innerHTML = `${label} <span class="text-xs opacity-80 ml-1">(${count})</span>`;
            btn.onclick = () => filterByCategory(cat);
            return btn;
        }

        function filterByCategory(category) {
            currentCategory = category;
            
            // Update buttons
            document.querySelectorAll('.category-badge').forEach(btn => {
                const isTarget = btn.dataset.category === category;
                btn.className = isTarget
                    ? 'category-badge px-6 py-2 rounded-full bg-blue-600 text-white font-semibold shadow-md transform scale-105 transition-all'
                    : 'category-badge px-6 py-2 rounded-full bg-white text-gray-700 font-semibold shadow-sm hover:bg-gray-50 border border-gray-200 transition-all';
            });

            const filtered = category === 'all' ? allProducts : allProducts.filter(p => p.category === category);
            renderProducts(filtered);
            
            if(history.pushState) history.pushState(null, null, '#' + category);
        }

        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            const noResults = document.getElementById('no-results');
            
            if (products.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }
            
            noResults.classList.add('hidden');
            grid.innerHTML = products.map(product => {
                const img = product.images?.[0] || 'images/products/default-product.jpg';
                return `
                <div class="product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-full group">
                    <div class="h-56 overflow-hidden relative bg-gray-100">
                        <img src="${img}" onerror="this.src='images/products/default-product.jpg'" 
                             class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" alt="${product.name}">
                        <div class="absolute top-3 left-3">
                            <span class="text-xs font-bold text-blue-800 uppercase bg-white/90 px-2 py-1 rounded backdrop-blur-sm shadow-sm">
                                ${formatCategory(product.category)}
                            </span>
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="font-bold text-lg mb-2 text-gray-900 line-clamp-2 hover:text-blue-700">
                            <a href="product-detail.html?id=${product.id}">${product.name}</a>
                        </h3>
                        <p class="text-gray-600 text-sm mb-4 line-clamp-3 flex-grow">${product.short || product.description?.substring(0,80) || ''}...</p>
                        <div class="pt-4 border-t border-gray-100 flex justify-between items-center mt-auto">
                            <a href="product-detail.html?id=${product.id}" class="text-blue-600 font-semibold text-sm hover:underline">View Details</a>
                            <a href="https://wa.me/447895047944" target="_blank" class="bg-green-500 text-white px-3 py-1.5 rounded text-sm hover:bg-green-600 transition">
                                <i class="fab fa-whatsapp"></i> Inquire
                            </a>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function formatCategory(cat) {
            if (!cat) return '';
            return cat.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function handleLoadError(error) {
            console.error(error);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        function retryLoading() {
            document.getElementById('error').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            initializeCatalog();
        }

        function resetFilters() { filterByCategory('all'); }
        
        function handleUrlHash() {
            const hash = window.location.hash.substring(1);
            if (hash && categoryCounts[hash]) filterByCategory(hash);
        }

        document.addEventListener('DOMContentLoaded', initializeCatalog);
    </script>
</body>
</html>
