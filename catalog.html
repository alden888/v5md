<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse V5 Medical's complete catalog. Surgical sutures, packs, injection devices, and dental products. ISO 13485 Certified.">
    <title>Product Catalog | V5 Medical LTD</title>
    <link rel="icon" type="image/x-icon" href="images/icons/favicon.ico">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#1e40af', secondary: '#3b82f6' } }
            }
        }
    </script>
    <style>
        /* Sidebar active state styling */
        .cat-link.active {
            background-color: #eff6ff; /* blue-50 */
            color: #1e40af; /* blue-800 */
            border-right: 3px solid #1e40af;
            font-weight: 600;
        }
        /* Mobile horizontal scroll */
        .mobile-scroll::-webkit-scrollbar { display: none; }
        .mobile-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <div id="v5-header"></div>

    <main class="flex-grow pt-24 pb-12"> <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div class="md:hidden mb-6 space-y-4">
                <div class="relative">
                    <input type="text" id="mobile-search" placeholder="Search products..." 
                           class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"
                           oninput="handleSearch(this.value)">
                    <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                <div class="flex gap-2 overflow-x-auto mobile-scroll pb-2" id="mobile-filters">
                    </div>
            </div>

            <div class="flex flex-col md:flex-row gap-8 lg:gap-12">
                
                <aside class="hidden md:block w-64 flex-shrink-0">
                    <div class="sticky top-28 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                        <h3 class="font-bold text-gray-900 mb-4 px-2 uppercase text-xs tracking-wider">Categories</h3>
                        <nav class="space-y-1" id="desktop-sidebar">
                            <div class="animate-pulse space-y-3">
                                <div class="h-6 bg-gray-100 rounded w-3/4"></div>
                                <div class="h-6 bg-gray-100 rounded w-full"></div>
                                <div class="h-6 bg-gray-100 rounded w-5/6"></div>
                            </div>
                        </nav>

                        <div class="mt-8 pt-6 border-t border-gray-100">
                            <h3 class="font-bold text-gray-900 mb-4 px-2 uppercase text-xs tracking-wider">Need Help?</h3>
                            <a href="contact.html" class="flex items-center gap-3 px-2 py-2 text-sm text-gray-600 hover:text-blue-600 transition">
                                <i class="far fa-envelope"></i> Contact Sales
                            </a>
                            <a href="https://wa.me/447895047944" target="_blank" class="flex items-center gap-3 px-2 py-2 text-sm text-gray-600 hover:text-green-600 transition">
                                <i class="fab fa-whatsapp"></i> WhatsApp Chat
                            </a>
                        </div>
                    </div>
                </aside>

                <div class="flex-1">
                    
                    <div class="hidden md:flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h1 class="text-xl font-bold text-gray-800" id="page-title">All Products</h1>
                        <div class="relative w-72">
                            <input type="text" id="desktop-search" placeholder="Search name, category..." 
                                   class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm"
                                   oninput="handleSearch(this.value)">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        </div>
                    </div>

                    <div id="loading" class="text-center py-20">
                        <div class="loader-spinner border-blue-600 border-t-transparent mx-auto mb-4"></div>
                        <p class="text-gray-500">Loading catalog...</p>
                    </div>

                    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        </div>

                    <div id="no-results" class="hidden text-center py-16 bg-white rounded-xl border border-dashed border-gray-300">
                        <div class="text-gray-300 text-5xl mb-4"><i class="fas fa-search"></i></div>
                        <p class="text-gray-600 font-medium">No products match your search.</p>
                        <button onclick="resetFilters()" class="mt-4 text-blue-600 font-semibold hover:underline text-sm">View All Products</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="v5-footer"></div>

    <script src="js/config.js?v=2.0"></script>
    <script src="js/layout.js?v=2.1"></script>
    <script src="js/complete-products.js?v=3.2.0"></script>
    <script src="js/product-loader.js?v=2.0"></script>

    <script>
        // State
        let allProducts = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let categoryCounts = {};
        let categoriesMap = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Load Products
                const db = await window.productLoader.loadProducts();
                allProducts = db.products || [];
                categoriesMap = db.categories || {};

                if (!allProducts.length) throw new Error('No products loaded');

                console.log(`[Catalog] Loaded ${allProducts.length} items`);

                // Initial Render
                calculateCounts();
                renderSidebar();
                renderMobileFilters();
                applyFilters();

                document.getElementById('loading').classList.add('hidden');

                // Check URL Hash
                const hash = window.location.hash.substring(1);
                if (hash) filterByCategory(hash);

            } catch (err) {
                console.error(err);
                document.getElementById('products-grid').innerHTML = 
                    `<div class="col-span-full text-center py-10 text-red-500">Failed to load products. Please refresh.</div>`;
                document.getElementById('loading').classList.add('hidden');
            }
        });

        // --- Logic ---

        function calculateCounts() {
            categoryCounts = { 'all': allProducts.length };
            allProducts.forEach(p => {
                const c = p.category || 'uncategorized';
                categoryCounts[c] = (categoryCounts[c] || 0) + 1;
            });
        }

        function renderSidebar() {
            const sidebar = document.getElementById('desktop-sidebar');
            if (!sidebar) return;

            let html = `
                <a href="#" onclick="filterByCategory('all'); return false;" 
                   class="cat-link group flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-md transition-colors ${currentCategory === 'all' ? 'active' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'}">
                    <span>All Products</span>
                    <span class="bg-gray-100 text-gray-600 py-0.5 px-2 rounded-full text-xs">${categoryCounts['all']}</span>
                </a>
            `;

            Object.keys(categoriesMap).forEach(key => {
                if (categoryCounts[key]) {
                    const isActive = currentCategory === key;
                    html += `
                        <a href="#${key}" onclick="filterByCategory('${key}'); return false;" 
                           class="cat-link group flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-md transition-colors ${isActive ? 'active' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'}">
                            <span>${categoriesMap[key]}</span>
                            <span class="bg-gray-100 text-gray-600 py-0.5 px-2 rounded-full text-xs">${categoryCounts[key]}</span>
                        </a>
                    `;
                }
            });

            sidebar.innerHTML = html;
        }

        function renderMobileFilters() {
            const container = document.getElementById('mobile-filters');
            if (!container) return;

            let html = `
                <button onclick="filterByCategory('all')" 
                        class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium border transition-colors ${currentCategory === 'all' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300'}">
                    All (${categoryCounts['all']})
                </button>
            `;

            Object.keys(categoriesMap).forEach(key => {
                if (categoryCounts[key]) {
                    const isActive = currentCategory === key;
                    html += `
                        <button onclick="filterByCategory('${key}')" 
                                class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium border transition-colors ${isActive ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300'}">
                            ${categoriesMap[key]}
                        </button>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            // Sync both inputs
            document.getElementById('mobile-search').value = val;
            document.getElementById('desktop-search').value = val;
            applyFilters();
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            
            // Update Title
            const title = cat === 'all' ? 'All Products' : categoriesMap[cat];
            document.getElementById('page-title').textContent = title;

            // Re-render navs to update active state
            renderSidebar();
            renderMobileFilters();
            
            applyFilters();
            
            // Update URL hash without scroll
            if(history.pushState) history.pushState(null, null, cat === 'all' ? ' ' : '#' + cat);
        }

        function applyFilters() {
            const grid = document.getElementById('products-grid');
            const noResults = document.getElementById('no-results');

            // Advanced Filter Logic
            const filtered = allProducts.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = !searchQuery || 
                    p.name.toLowerCase().includes(searchQuery) || 
                    (p.short && p.short.toLowerCase().includes(searchQuery)) ||
                    (p.category && p.category.toLowerCase().includes(searchQuery)); // Also search category name
                
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                grid.innerHTML = filtered.map(renderProductCard).join('');
            }
        }

        function resetFilters() {
            handleSearch('');
            filterByCategory('all');
        }

        function renderProductCard(product) {
            const imgPath = product.images?.[0] || 'images/products/default-product.jpg';
            const catLabel = categoriesMap[product.category] || 'Product';

            return `
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition-all duration-300 group flex flex-col h-full">
                <div class="relative h-48 bg-gray-50 overflow-hidden">
                    <img src="${imgPath}" 
                         onerror="this.src='images/products/default-product.jpg'" 
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                         alt="${product.name}" loading="lazy">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors"></div>
                    <span class="absolute top-2 right-2 bg-white/90 backdrop-blur text-xs font-bold text-gray-700 px-2 py-1 rounded shadow-sm">
                        ${catLabel}
                    </span>
                </div>
                
                <div class="p-5 flex flex-col flex-grow">
                    <h3 class="font-bold text-lg text-gray-900 mb-2 line-clamp-2 hover:text-blue-600 transition">
                        <a href="product-detail.html?id=${product.id}">${product.name}</a>
                    </h3>
                    <p class="text-sm text-gray-500 mb-4 line-clamp-2 flex-grow">
                        ${product.short || product.description}
                    </p>
                    
                    <div class="pt-4 mt-auto border-t border-gray-50 flex items-center justify-between gap-2">
                        <a href="product-detail.html?id=${product.id}" class="text-sm font-medium text-blue-600 hover:text-blue-800">
                            Details <i class="fas fa-arrow-right text-xs ml-1"></i>
                        </a>
                        <a href="https://wa.me/447895047944?text=Inquiry: ${encodeURIComponent(product.name)}" target="_blank" 
                           class="bg-gray-100 text-gray-600 hover:bg-green-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                            <i class="fab fa-whatsapp"></i> Quote
                        </a>
                    </div>
                </div>
            </div>`;
        }
    </script>
</body>
</html>
