<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog | V5 Medical LTD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='index.html'">
                <img src="https://raw.githubusercontent.com/alden888/v5md/main/images/logo/v5logo.png" class="h-12" alt="V5 Medical" />
                <div>
                    <div class="font-bold text-xl text-blue-900">V5 Medical LTD</div>
                    <div class="text-xs text-blue-600">Global Medical Supplier</div>
                </div>
            </div>
            <div class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="font-medium text-gray-600 hover:text-blue-900">Home</a>
                <a href="catalog.html" class="font-medium text-blue-900 border-b-2 border-blue-900">Products</a>
                <a href="about.html" class="font-medium text-gray-600 hover:text-blue-900">About</a>
                <a href="contact.html" class="font-medium text-gray-600 hover:text-blue-900">Contact</a>
                <a href="https://wa.me/447895047944" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-full font-semibold flex items-center">
                    <i class="fab fa-whatsapp mr-2"></i> WhatsApp
                </a>
            </div>
            <button id="mobile-menu-btn" class="md:hidden text-gray-800">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="pt-32 pb-16 bg-gradient-to-r from-blue-600 to-cyan-500 text-white">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-6">Our Product Catalog</h1>
            <p class="text-xl mb-8">ISO 13485, CE & FDA Certified Medical Products</p>
        </div>
    </section>

    <!-- Category Filters -->
    <section class="max-w-7xl mx-auto px-4 -mt-8 mb-12">
        <div class="bg-white rounded-xl shadow-lg p-6 flex flex-wrap gap-4 justify-center">
            <button onclick="filterCategory('all')" class="category-btn active px-6 py-3 rounded-lg font-medium transition bg-blue-600 text-white">
                All Products
            </button>
            <button onclick="filterCategory('surgical-sutures')" class="category-btn px-6 py-3 rounded-lg font-medium transition bg-gray-100 hover:bg-blue-100">
                Surgical Sutures
            </button>
            <button onclick="filterCategory('surgical-instruments')" class="category-btn px-6 py-3 rounded-lg font-medium transition bg-gray-100 hover:bg-blue-100">
                Surgical Instruments
            </button>
            <button onclick="filterCategory('gauze-dressings')" class="category-btn px-6 py-3 rounded-lg font-medium transition bg-gray-100 hover:bg-blue-100">
                Gauze Dressings
            </button>
            <button onclick="filterCategory('protective-equipment')" class="category-btn px-6 py-3 rounded-lg font-medium transition bg-gray-100 hover:bg-blue-100">
                Protective Equipment
            </button>
            <button onclick="filterCategory('injection-infusion')" class="category-btn px-6 py-3 rounded-lg font-medium transition bg-gray-100 hover:bg-blue-100">
                Injection & Infusion
            </button>
            <button onclick="filterCategory('dental-products')" class="category-btn px-6 py-3 rounded-lg font-medium transition bg-gray-100 hover:bg-blue-100">
                Dental Products
            </button>
            <button onclick="filterCategory('surgical-packs')" class="category-btn px-6 py-3 rounded-lg font-medium transition bg-gray-100 hover:bg-blue-100">
                Surgical Packs
            </button>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="max-w-7xl mx-auto px-4 pb-20">
        <div id="products-container" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20">
                <div class="inline-block w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-xl text-gray-600">Loading products...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12 text-center">
        <div class="max-w-7xl mx-auto px-4">
            <p class="text-gray-400 mb-4">© 2025 V5 Medical LTD. All rights reserved.</p>
            <div class="flex justify-center gap-6">
                <a href="https://linkedin.com/company/v5med" class="hover:text-blue-400"><i class="fab fa-linkedin text-2xl"></i></a>
                <a href="https://youtube.com/@v5med" class="hover:text-red-400"><i class="fab fa-youtube text-2xl"></i></a>
            </div>
        </div>
    </footer>

    <!-- WhatsApp Float Button -->
    <a href="https://wa.me/447895047944" target="_blank" class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center z-50">
        <i class="fab fa-whatsapp text-2xl"></i>
    </a>

    <script src="https://raw.githubusercontent.com/alden888/v5md/main/js/products.js"></script>
    <script>
        console.log('[Catalog] Page loaded');

        // Category filtering
        let currentCategory = 'all';

        function filterCategory(category) {
            currentCategory = category;
            console.log('[Catalog] Filtering by category:', category);
            
            // Update button states
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-100');
            });
            event.target.classList.add('active', 'bg-blue-600', 'text-white');
            event.target.classList.remove('bg-gray-100');
            
            // Reload products
            loadProducts();
        }

        // Load products
        function loadProducts() {
            console.log('[Catalog] Loading products...');
            
            // Check if database is loaded
            const db = window.productDatabase || window.finalProductDatabase;
            if (!db) {
                console.error('[Catalog] Product database not loaded!');
                showError('Product database failed to load. Please refresh the page.');
                return;
            }
            
            console.log('[Catalog] Database found with', Object.keys(db).length, 'products');
            
            // Filter products
            let products = Object.values(db);
            if (currentCategory !== 'all') {
                products = products.filter(p => p.category === currentCategory);
            }
            
            console.log('[Catalog] Filtered to', products.length, 'products');
            
            // Display products
            const container = document.getElementById('products-container');
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <i class="fas fa-box-open text-6xl text-gray-300 mb-4"></i>
                        <p class="text-xl text-gray-600">No products found in this category.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow-md hover:shadow-xl transition-shadow overflow-hidden">
                    <div class="relative cursor-pointer" onclick="location.href='product-detail.html?id=${product.id}'">
                        <img src="${product.images[0]}" 
                             alt="${product.name}"
                             class="w-full h-48 object-cover"
                             onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                        <div class="absolute top-2 right-2 bg-green-500 text-white text-xs px-2 py-1 rounded-full">
                            ${product.availability || 'In Stock'}
                        </div>
                    </div>
                    <div class="p-6">
                        <h3 class="font-bold text-lg mb-2 cursor-pointer hover:text-blue-600" onclick="location.href='product-detail.html?id=${product.id}'">
                            ${product.name}
                        </h3>
                        <p class="text-gray-600 text-sm mb-4">${product.short}</p>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${product.certifications.map(cert => 
                                `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">${cert}</span>`
                            ).join('')}
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="font-medium text-gray-900">${product.price}</span>
                            <button onclick="location.href='product-detail.html?id=${product.id}'" 
                                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm transition">
                                Details
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showError(message) {
            const container = document.getElementById('products-container');
            container.innerHTML = `
                <div class="col-span-full text-center py-20">
                    <i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-4"></i>
                    <p class="text-xl text-gray-800 mb-2">Error Loading Products</p>
                    <p class="text-gray-600">${message}</p>
                    <button onclick="location.reload()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg">
                        Retry
                    </button>
                </div>
            `;
        }

        // Mobile menu
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            alert('Mobile menu - to be implemented');
        });

        // Wait for database to load
        let checkCount = 0;
        const checkDatabase = setInterval(() => {
            checkCount++;
            console.log('[Catalog] Check', checkCount, '- Database available:', !!(window.productDatabase || window.finalProductDatabase));
            
            if (window.productDatabase || window.finalProductDatabase) {
                clearInterval(checkDatabase);
                loadProducts();
            } else if (checkCount > 20) {
                clearInterval(checkDatabase);
                showError('Product database failed to load after 20 attempts.');
            }
        }, 250);
    </script>
</body>
</html>
