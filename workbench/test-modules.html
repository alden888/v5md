<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>模块加载测试</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        .pass { color: #0f0; }
        .fail { color: #f00; }
        pre { background: #111; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>V14.0 模块加载快速测试</h1>
    <div id="output"></div>
    
    <!-- 加载模块 -->
    <script src="js/workbench-config.js"></script>
    <script src="js/workbench-utils.js"></script>
    <script src="js/workbench-storage.js"></script>
    <script src="js/workbench-dashboard.js"></script>
    <script src="js/workbench-orders.js"></script>
    <script src="js/workbench-suppliers.js"></script>
    <script src="js/workbench-finance.js"></script>
    
    <script>
        setTimeout(() => {
            const output = document.getElementById('output');
            const modules = [
                'WorkbenchConfig',
                'WorkbenchUtils',
                'WorkbenchStorage',
                'WorkbenchDashboard',
                'WorkbenchOrders',
                'WorkbenchSuppliers',
                'WorkbenchFinance'
            ];
            
            let html = '<h2>模块检测结果：</h2>';
            let allPass = true;
            
            modules.forEach(name => {
                const exists = !!window[name];
                const className = exists ? 'pass' : 'fail';
                const icon = exists ? '✅' : '❌';
                html += `<div class="${className}">${icon} ${name}: ${exists ? 'LOADED' : 'MISSING'}</div>`;
                if (!exists) allPass = false;
            });
            
            html += '<br>';
            if (allPass) {
                html += '<h2 class="pass">🎉 所有模块加载成功！</h2>';
                html += '<p>你可以正常使用系统了。</p>';
            } else {
                html += '<h2 class="fail">❌ 有模块加载失败！</h2>';
                html += '<p>请按照修复指南操作。</p>';
            }
            
            html += '<br><h3>Window对象中的Workbench属性：</h3>';
            const workbenchProps = Object.keys(window).filter(k => k.startsWith('Workbench'));
            html += `<pre>${JSON.stringify(workbenchProps, null, 2)}</pre>`;
            
            output.innerHTML = html;
            
            // 输出到控制台
            console.log('=== 模块加载测试 ===');
            modules.forEach(name => {
                console.log(`${window[name] ? '✅' : '❌'} ${name}`);
            });
            console.log('Workbench 属性:', workbenchProps);
        }, 500);
    </script>
</body>
</html>
