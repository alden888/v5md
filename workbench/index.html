<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<!-- 加载所有增强版模块 -->
<script src="js/workbench-firebase.js"></script>
<script src="js/workbench-config.js"></script>
<script src="js/workbench-utils-enhanced.js"></script> <!-- 替换原 workbench-utils.js -->
<script src="js/workbench-storage.js"></script>
<script src="js/workbench-auth.js"></script>
<script src="js/workbench-dashboard.js"></script>
<script src="js/workbench-orders-enhanced.js"></script> <!-- 替换原 workbench-orders.js -->
<script src="js/workbench-suppliers-enhanced.js"></script> <!-- 替换原 workbench-suppliers.js -->
<script src="js/workbench-finance.js"></script>
<script src="js/workbench-crm-expenses.js"></script> <!-- 新增模块 -->

<script>
// ========================================
// V14.1 主应用控制器 (更新版)
// ========================================
document.addEventListener('DOMContentLoaded', async function() {
    console.log('[V14.1] 🚀 System Initializing...');

    // 初始化模块
    try {
        if (WorkbenchDashboard?.init) await WorkbenchDashboard.init();
        if (WorkbenchOrders?.init) WorkbenchOrders.init();
        if (WorkbenchSuppliers?.init) WorkbenchSuppliers.init();
        if (WorkbenchFinance?.init) WorkbenchFinance.init();
    } catch (error) {
        console.error('[V14.1] Module init failed:', error);
    }

    // 全局 APP 对象 (更新版)
    window.app = {
        // === 生存模式 ===
        survival: {
            checkInputs: () => {
                const inputs = [
                    document.getElementById('action-1'),
                    document.getElementById('action-2'),
                    document.getElementById('action-3')
                ];
                const filled = inputs.every(input => input && input.value.trim());
                const btn = document.getElementById('battle-start-btn');
                if (btn) btn.disabled = !filled;
                
                // 视觉反馈
                inputs.forEach(input => {
                    if (input) {
                        if (input.value.trim()) {
                            input.classList.add('filled');
                        } else {
                            input.classList.remove('filled');
                        }
                    }
                });
            },
            
            startBattle: () => {
                const actions = [
                    document.getElementById('action-1').value,
                    document.getElementById('action-2').value,
                    document.getElementById('action-3').value
                ];
                
                localStorage.setItem('v14_today_actions', JSON.stringify(actions));
                localStorage.setItem('v14_unlock_time', Date.now());
                
                document.getElementById('iron-curtain').classList.add('hidden');
                WorkbenchDashboard.renderTodayActions(actions);
                WorkbenchUtils.toast('战斗开始！现金为王！', 'success');
            },
            
            emergencyOverride: () => {
                if(confirm("⚠️ 确定启用紧急模式？\n紧急模式将在10分钟后自动退出。")) {
                    document.getElementById('iron-curtain').classList.add('hidden');
                    document.getElementById('emergency-mode-warning').classList.remove('hidden');
                    
                    // 10分钟后自动重载
                    setTimeout(() => {
                        alert('紧急模式超时，系统将重新加载');
                        location.reload();
                    }, 10 * 60 * 1000);
                    
                    WorkbenchUtils.toast('紧急模式已激活 (10分钟)', 'warning');
                }
            },
            
            initCheck: () => {
                const lastUnlock = localStorage.getItem('v14_unlock_time');
                const now = Date.now();
                
                // 30分钟有效期
                if (!lastUnlock || (now - lastUnlock > 30 * 60 * 1000)) {
                    document.getElementById('iron-curtain').classList.remove('hidden');
                } else {
                    document.getElementById('iron-curtain').classList.add('hidden');
                    const savedActions = JSON.parse(localStorage.getItem('v14_today_actions') || '[]');
                    WorkbenchDashboard.renderTodayActions(savedActions);
                }
            }
        },

        // === 看板（订单）===
        kanban: {
            openQuickAdd: () => WorkbenchOrders?.openQuickAdd(),
            closeQuickAdd: () => WorkbenchOrders?.closeQuickAdd(),
            saveQuickOrder: () => WorkbenchOrders?.saveQuickOrder(),
            openFullAddModal: () => WorkbenchOrders?.openFullAddModal(),
            closeFullAddModal: () => WorkbenchOrders?.closeFullAddModal(),
            saveFullOrder: () => WorkbenchOrders?.saveFullOrder()
        },

        // === 供应商 ===
        suppliers: {
            openAddModal: () => WorkbenchSuppliers?.openAddModal(),
            closeSupplierModal: () => WorkbenchSuppliers?.closeSupplierModal(),
            saveSupplier: () => WorkbenchSuppliers?.saveSupplier(),
            edit: (id) => WorkbenchSuppliers?.edit(id),
            delete: (id) => WorkbenchSuppliers?.delete(id)
        },

        // === CRM（客户）=== 【🔥 更新这里】
        crm: {
            openCustomerModal: () => WorkbenchCRM?.openCustomerModal(),
            closeCustomerModal: () => WorkbenchCRM?.closeCustomerModal(),
            saveCustomer: () => WorkbenchCRM?.saveCustomer(),
            render: () => WorkbenchCRM?.render(),
            copyAddress: (id) => WorkbenchCRM?.copyAddress(id),
            deleteCustomer: (id) => WorkbenchCRM?.deleteCustomer(id)
        },
        
        // === 运营支出 === 【🔥 更新这里】
        expenses: {
            openAddModal: () => WorkbenchExpenses?.openAddModal(),
            closeExpenseModal: () => WorkbenchExpenses?.closeExpenseModal(),
            saveExpense: () => WorkbenchExpenses?.saveExpense(),
            render: () => WorkbenchExpenses?.render(),
            delete: (id) => WorkbenchExpenses?.delete(id)
        },

        // === Tab切换 ===
        ui: {
            switchTab: (tabId) => {
                // 隐藏所有tab
                document.querySelectorAll('.tab-content').forEach(el => {
                    el.style.display = 'none';
                });
                
                // 移除按钮active状态
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                
                // 显示目标tab
                const content = document.getElementById(`tab-${tabId}`);
                if (content) content.style.display = 'block';
                
                // 激活按钮
                const btn = document.querySelector(`.tab-button[data-tab="${tabId}"]`);
                if (btn) btn.classList.add('active');

                // 触发渲染
                if (tabId === 'kanban' && WorkbenchOrders) WorkbenchOrders.render();
                if (tabId === 'suppliers' && WorkbenchSuppliers) WorkbenchSuppliers.render();
                if (tabId === 'crm' && WorkbenchCRM) WorkbenchCRM.render();
                if (tabId === 'expenses' && WorkbenchExpenses) WorkbenchExpenses.render();
            }
        },

        // === 设置 ===
        openSettings: () => {
            const modal = document.getElementById('settings-modal');
            if (modal) {
                modal.classList.add('active');
                // 加载当前设置
                document.getElementById('settings-target').value = WorkbenchDashboard.data.target;
                document.getElementById('settings-rate').value = WorkbenchDashboard.data.rate;
                document.getElementById('settings-webhook').value = WorkbenchDashboard.data.feishuWebhook || '';
                document.getElementById('settings-worker').value = WorkbenchStorage.WORKER_URL || '';
            }
        },
        
        closeSettings: () => {
            const modal = document.getElementById('settings-modal');
            if (modal) modal.classList.remove('active');
        },
        
        saveSettings: () => {
            const target = parseFloat(document.getElementById('settings-target').value);
            const rate = parseFloat(document.getElementById('settings-rate').value);
            const webhook = document.getElementById('settings-webhook').value;
            const worker = document.getElementById('settings-worker').value;
            
            WorkbenchDashboard.data.target = target;
            WorkbenchDashboard.data.rate = rate;
            WorkbenchDashboard.data.feishuWebhook = webhook;
            
            WorkbenchStorage.save(WorkbenchConfig.STORAGE_KEYS.TARGET, target);
            WorkbenchStorage.save(WorkbenchConfig.STORAGE_KEYS.USD_RATE, rate);
            WorkbenchStorage.save(WorkbenchConfig.STORAGE_KEYS.FEISHU_WEBHOOK, webhook);
            WorkbenchStorage.setWorkerUrl(worker);
            
            WorkbenchUtils.toast('设置已保存', 'success');
            app.closeSettings();
            WorkbenchDashboard.updateDashboard();
        },

        // === 数据导出 ===
        exportData: () => {
            const backup = WorkbenchStorage.exportAll();
            const filename = `V5_Medical_V14.1_Backup_${new Date().toISOString().slice(0,10)}.json`;
            WorkbenchUtils.downloadJSON(backup, filename);
            WorkbenchUtils.toast('数据已导出', 'success');
        }
    };

    // 绑定Tab点击
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.onclick = function() {
            app.ui.switchTab(this.dataset.tab);
        };
    });
    
    // 绑定输入框检查
    ['action-1', 'action-2', 'action-3'].forEach(id => {
        const input = document.getElementById(id);
        if (input) {
            input.oninput = app.survival.checkInputs;
        }
    });
    
    // 绑定开始战斗按钮
    const battleBtn = document.getElementById('battle-start-btn');
    if (battleBtn) {
        battleBtn.onclick = app.survival.startBattle;
    }

    // 初始化检查
    app.survival.initCheck();
    
    // 首次渲染 【🔥 更新这里】
    WorkbenchCRM.render();
    WorkbenchExpenses.render();

    console.log('[V14.1] ✅ System Online - All Modules Loaded');
});
</script>

</body>
</html>
