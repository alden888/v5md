<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V5 Medical 工作台 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        sidebar: '#0f172a'
                    }
                }
            }
        }
    </script>
    <style>
        .sidebar-nav { position: fixed; left: 0; top: 70px; bottom: 0; width: 16rem; background: #0f172a; color: #cbd5e1; z-index: 40; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; padding: 0.75rem 1.5rem; font-size: 0.875rem; border-left: 4px solid transparent; transition: all 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-left-color: #3b82f6; }
        .main-content { margin-left: 16rem; padding-top: 90px; padding-bottom: 3rem; padding-left: 2rem; padding-right: 2rem; }
        @media (max-width: 768px) { 
            .sidebar-nav { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body class="bg-slate-50">

<!-- 顶部导航 -->
<header class="fixed top-0 left-0 right-0 bg-white shadow-sm border-b border-slate-200 z-50 h-[70px] flex items-center justify-between px-6">
    <div class="flex items-center gap-3">
        <div class="bg-primary text-white w-9 h-9 rounded-lg flex items-center justify-center font-bold text-lg">V5</div>
        <div>
            <h1 class="font-bold text-lg text-slate-800">2026 冲锋号</h1>
            <div class="text-[10px] text-slate-500 uppercase tracking-wider">Target: ¥<span id="header-target">5,000,000</span></div>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <div class="hidden md:flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full text-xs font-medium text-slate-600">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span>Internal Use</span>
        </div>
    </div>
</header>

<!-- 侧边栏 -->
<aside class="sidebar-nav" id="sidebar">
    <div class="p-6 pb-4">
        <div class="bg-gradient-to-br from-indigo-900 to-slate-900 rounded-xl p-4 text-white shadow-xl">
            <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Achievement</div>
            <div class="font-bold text-2xl flex items-baseline gap-1">
                <span id="sidebar-percent">0.0</span><span class="text-sm">%</span>
            </div>
            <div class="w-full bg-slate-700 h-1.5 rounded-full mt-2 overflow-hidden">
                <div id="sidebar-progress" class="bg-green-400 h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>
    </div>
    
    <div class="px-6 pb-4">
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">核心业务</div>
    </div>
    
    <a href="#dashboard" class="nav-item active" data-section="dashboard">
        <i class="fas fa-tachometer-alt mr-3 w-5 text-center"></i> 战报指挥舱
    </a>
    <a href="#orders" class="nav-item" data-section="orders">
        <i class="fas fa-file-invoice-dollar mr-3 w-5 text-center"></i> 订单管理
    </a>
    <a href="#pricing" class="nav-item" data-section="pricing">
        <i class="fas fa-calculator mr-3 w-5 text-center"></i> 报价核算
    </a>
    <a href="#finance" class="nav-item" data-section="finance">
        <i class="fas fa-university mr-3 w-5 text-center"></i> 财务对账
    </a>
</aside>

<!-- 主内容区 -->
<main class="main-content" id="main-content">
    <!-- Toast 通知 -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
        <div class="bg-white shadow-lg rounded-lg border border-slate-200 p-4 flex items-center gap-3">
            <i class="fas fa-check-circle text-green-500 text-xl"></i>
            <div>
                <div class="font-bold text-sm text-slate-800" id="toast-message">操作成功</div>
            </div>
        </div>
    </div>

    <!-- 全球商机时钟 -->
    <div class="mb-8">
        <div class="flex items-center gap-2 mb-3">
            <span class="w-1 h-4 bg-primary rounded-full"></span>
            <h3 class="font-bold text-slate-700">全球商机时钟 (Business Hours)</h3>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3" id="world-clock"></div>
    </div>

    <!-- 仪表盘内容 -->
    <section id="dashboard-section">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-slate-800 mb-2">年度战报指挥舱</h2>
            <p class="text-sm text-slate-500">实时业绩监控与目标达成追踪</p>
        </div>

        <!-- KPI 卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 border-l-4 border-l-blue-500">
                <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">年度达成率</div>
                <div class="text-3xl font-black text-slate-800 mb-1"><span id="kpi-percent">0.0</span>%</div>
                <div class="mt-3 w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div id="kpi-progress" class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 border-l-4 border-l-green-500">
                <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">已回款金额</div>
                <div class="text-3xl font-black text-green-600" id="kpi-sales">¥0</div>
                <div class="text-xs text-slate-400 mt-1">折合约 $<span id="kpi-sales-usd">0</span></div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 border-l-4 border-l-red-500">
                <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">距离目标还差</div>
                <div class="text-3xl font-black text-red-500" id="kpi-gap">¥500.0w</div>
                <div class="text-xs text-slate-400 mt-1">需每日 ¥<span id="kpi-daily">0</span></div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 border-l-4 border-l-yellow-500">
                <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">待回款 Pipeline</div>
                <div class="text-3xl font-black text-yellow-600" id="kpi-pipeline">¥0</div>
                <div class="text-xs text-slate-400 mt-1"><span id="kpi-pending">0</span> 个订单跟进中</div>
            </div>
        </div>

        <!-- 最近订单 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fas fa-file-invoice text-blue-600"></i> 最近订单记录
            </h3>
            <div id="recent-orders" class="text-center py-8 text-slate-400">暂无订单记录</div>
        </div>
    </section>
</main>

<script>
// ============================================
// 1. 全局配置 (Config)
// ============================================
const WorkbenchConfig = {
    VERSION: '2.0.0',
    WORKBENCH: {
        DEFAULT_ANNUAL_TARGET: 5000000,
        DEFAULT_USD_RATE: 7.25,
        WORLD_CITIES: [
            { name: 'Beijing', tz: 'Asia/Shanghai', icon: '🇨🇳', workHours: [9, 18] },
            { name: 'London', tz: 'Europe/London', icon: '🇬🇧', workHours: [9, 17] },
            { name: 'New York', tz: 'America/New_York', icon: '🇺🇸', workHours: [9, 17] },
            { name: 'Dubai', tz: 'Asia/Dubai', icon: '🇦🇪', workHours: [8, 17] },
            { name: 'Istanbul', tz: 'Europe/Istanbul', icon: '🇹🇷', workHours: [9, 18] },
            { name: 'São Paulo', tz: 'America/Sao_Paulo', icon: '🇧🇷', workHours: [9, 18] }
        ]
    }
};

// ============================================
// 2. 工具类 (Utils)
// ============================================
const WorkbenchUtils = {
    toast: {
        show(message, duration = 3000) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-message');
            if (!toast || !msg) return;
            
            msg.textContent = message;
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, duration);
        }
    },
    
    formatNumber(num, decimals = 0) {
        if (!num) return '0';
        return Math.floor(num).toLocaleString('zh-CN', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        });
    }
};

// ============================================
// 3. 仪表盘类 (Dashboard)
// ============================================
class WorkbenchDashboard {
    constructor() {
        this.config = WorkbenchConfig;
        this.currentRate = 7.25;
        this.clockInterval = null;
        this.data = {
            orders: [],
            target: 5000000,
            totalSales: 0,
            pipeline: 0,
            achievement: 0
        };
    }

    async init() {
        console.log('[Dashboard] Initializing...');
        
        // 加载数据
        await this.loadData();
        
        // 渲染界面
        this.updateKPIs();
        
        // 初始化全球时钟
        this.initWorldClock();
        
        // 启动自动刷新
        this.startAutoRefresh();
        
        console.log('[Dashboard] Initialized successfully');
    }

    async loadData() {
        try {
            // 从 localStorage 加载订单数据
            const ordersData = localStorage.getItem('v5_orders');
            this.data.orders = ordersData ? JSON.parse(ordersData) : [];
            
            // 加载目标
            const targetData = localStorage.getItem('v5_target');
            this.data.target = targetData ? parseInt(targetData) : 5000000;
            
            // 加载汇率
            const rateData = localStorage.getItem('v5_usd_rate');
            this.currentRate = rateData ? parseFloat(rateData) : 7.25;
            
            // 计算指标
            this.calculateMetrics();
            
            console.log('[Dashboard] Data loaded:', this.data);
        } catch (error) {
            console.error('[Dashboard] Load data failed:', error);
            WorkbenchUtils.toast.show('数据加载失败');
        }
    }

    calculateMetrics() {
        let totalSalesRMB = 0;
        let pipelineRMB = 0;
        let pendingCount = 0;

        if (Array.isArray(this.data.orders)) {
            this.data.orders.forEach(order => {
                const amountRMB = order.total * this.currentRate;
                if (order.status === 'Paid') {
                    totalSalesRMB += amountRMB;
                } else if (order.status === 'Pending') {
                    pipelineRMB += amountRMB;
                    pendingCount++;
                }
            });
        }

        this.data.totalSales = totalSalesRMB;
        this.data.pipeline = pipelineRMB;
        this.data.achievement = this.data.target > 0 ? (totalSalesRMB / this.data.target) * 100 : 0;
        this.data.gap = this.data.target - totalSalesRMB;
        this.data.pendingCount = pendingCount;

        // 计算每日所需
        const today = new Date();
        const endYear = new Date(today.getFullYear(), 11, 31);
        const daysLeft = Math.ceil((endYear - today) / (1000 * 60 * 60 * 24));
        this.data.dailyNeed = daysLeft > 0 ? (this.data.gap / daysLeft) : 0;
    }

    updateKPIs() {
        // 更新达成率
        const percentEl = document.getElementById('kpi-percent');
        const progressEl = document.getElementById('kpi-progress');
        if (percentEl) percentEl.textContent = this.data.achievement.toFixed(1);
        if (progressEl) progressEl.style.width = Math.min(this.data.achievement, 100) + '%';

        // 更新已回款
        const salesEl = document.getElementById('kpi-sales');
        const salesUsdEl = document.getElementById('kpi-sales-usd');
        if (salesEl) salesEl.textContent = '¥' + WorkbenchUtils.formatNumber(this.data.totalSales);
        if (salesUsdEl) salesUsdEl.textContent = WorkbenchUtils.formatNumber(this.data.totalSales / this.currentRate);

        // 更新差额
        const gapEl = document.getElementById('kpi-gap');
        const dailyEl = document.getElementById('kpi-daily');
        if (gapEl) gapEl.textContent = '¥' + WorkbenchUtils.formatNumber(this.data.gap / 10000, 1) + 'w';
        if (dailyEl) dailyEl.textContent = WorkbenchUtils.formatNumber(this.data.dailyNeed);

        // 更新待回款
        const pipelineEl = document.getElementById('kpi-pipeline');
        const pendingEl = document.getElementById('kpi-pending');
        if (pipelineEl) pipelineEl.textContent = '¥' + WorkbenchUtils.formatNumber(this.data.pipeline);
        if (pendingEl) pendingEl.textContent = this.data.pendingCount;

        // 更新侧边栏
        const sidebarPercentEl = document.getElementById('sidebar-percent');
        const sidebarProgressEl = document.getElementById('sidebar-progress');
        if (sidebarPercentEl) sidebarPercentEl.textContent = this.data.achievement.toFixed(1);
        if (sidebarProgressEl) sidebarProgressEl.style.width = Math.min(this.data.achievement, 100) + '%';

        // 更新头部目标
        const headerTargetEl = document.getElementById('header-target');
        if (headerTargetEl) headerTargetEl.textContent = WorkbenchUtils.formatNumber(this.data.target);
    }

    initWorldClock() {
        const container = document.getElementById('world-clock');
        if (!container) {
            console.error('[Dashboard] World clock container not found');
            return;
        }

        // 清除旧的定时器
        if (this.clockInterval) {
            clearInterval(this.clockInterval);
        }

        const updateClock = () => {
            try {
                const cities = this.config.WORKBENCH.WORLD_CITIES;
                if (!cities || cities.length === 0) {
                    console.error('[Dashboard] No cities configured');
                    return;
                }

                container.innerHTML = cities.map(city => {
                    try {
                        const now = new Date();
                        const timeString = new Intl.DateTimeFormat('en-US', {
                            timeZone: city.tz,
                            hour: 'numeric',
                            minute: '2-digit',
                            hour12: false
                        }).format(now);

                        const hour = parseInt(timeString.split(':')[0]);
                        const isWorking = hour >= city.workHours[0] && hour < city.workHours[1];

                        return `
                            <div class="p-3 rounded-lg border transition ${isWorking ? 'bg-green-50 border-green-200' : 'bg-slate-50 border-slate-200'}">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="text-lg">${city.icon}</span>
                                        <div>
                                            <div class="text-xs font-bold text-slate-700">${city.name}</div>
                                            <div class="text-lg font-mono font-black text-slate-800">${timeString}</div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <span class="w-2 h-2 rounded-full ${isWorking ? 'bg-green-500 animate-pulse' : 'bg-slate-300'}"></span>
                                        <span class="text-[10px] font-bold ${isWorking ? 'text-green-600' : 'text-slate-400'}">${isWorking ? 'OPEN' : 'OFF'}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    } catch (error) {
                        console.error(`[Dashboard] Error rendering city ${city.name}:`, error);
                        return '';
                    }
                }).join('');
            } catch (error) {
                console.error('[Dashboard] Clock update failed:', error);
            }
        };

        // 立即执行一次
        updateClock();
        
        // 每分钟更新
        this.clockInterval = setInterval(updateClock, 60000);
        
        console.log('[Dashboard] World clock initialized');
    }

    startAutoRefresh() {
        setInterval(() => {
            this.loadData().then(() => this.updateKPIs());
        }, 60000); // 每分钟刷新
    }
}

// ============================================
// 4. 初始化应用
// ============================================
document.addEventListener('DOMContentLoaded', async () => {
    console.log('[App] Starting V5 Workbench...');
    
    try {
        // 创建全局实例
        window.WorkbenchConfig = WorkbenchConfig;
        window.WorkbenchUtils = WorkbenchUtils;
        
        // 初始化仪表盘
        window.dashboard = new WorkbenchDashboard();
        await window.dashboard.init();
        
        // 绑定导航
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
        
        console.log('[App] Workbench initialized successfully');
        WorkbenchUtils.toast.show('工作台启动成功！');
    } catch (error) {
        console.error('[App] Initialization failed:', error);
        alert('工作台初始化失败，请刷新页面重试');
    }
});
</script>

</body>
</html>
