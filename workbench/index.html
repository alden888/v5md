<!-- 🔥 模块加载完成处理 -->
<script>
document.addEventListener('DOMContentLoaded', async function() {
console.log('[V14.2 PRO] DOM加载完成，等待模块初始化...');

// 给模块一点时间完成加载
await new Promise(resolve => setTimeout(resolve, 500));

// 验证所有关键模块
const requiredModules = [
'WorkbenchConfig',
'WorkbenchUtils', 
'WorkbenchModal',
'WorkbenchState',
'WorkbenchStorage',
'WorkbenchAuth',
'WorkbenchDashboard',
'WorkbenchOrders',
'WorkbenchSuppliers',
'WorkbenchFinance',
'WorkbenchExpenses',
'WorkbenchCRM',
'app'
];

const missing = requiredModules.filter(m => typeof window[m] === 'undefined');

if (missing.length > 0) {
console.error('[V14.2 PRO] ❌ 缺失模块:', missing);
document.getElementById('loading-error').classList.remove('hidden');
document.getElementById('loading-error').innerHTML = `
<strong>模块加载失败</strong><br>
缺失模块: ${missing.join(', ')}<br>
<button onclick="location.reload()" class="mt-2 px-4 py-2 bg-red-600 rounded hover:bg-red-700">
重新加载
</button>
<a href="diagnostic.html" class="mt-2 ml-2 px-4 py-2 bg-blue-600 rounded hover:bg-blue-700 inline-block">
系统诊断
</a>
`;
} else {
console.log('[V14.2 PRO] ✅ 所有模块加载完成');
console.log('[V14.2 PRO] 已加载:', requiredModules.length, '个模块');

// 隐藏加载界面
setTimeout(() => {
const loadingEl = document.getElementById('system-loading');
if (loadingEl) {
loadingEl.style.opacity = '0';
loadingEl.style.transition = 'opacity 0.3s ease';
setTimeout(() => {
loadingEl.style.display = 'none';
}, 300);
}

// 启动应用
if (typeof app !== 'undefined' && app.init) {
console.log('[V14.2 PRO] 启动应用...');
app.init();
}
}, 300);
}
});
</script>
