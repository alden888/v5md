<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V14.0 模块诊断工具</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #ff0; }
        .test { margin: 10px 0; padding: 10px; background: #111; }
        .pass { border-left: 4px solid #0f0; }
        .fail { border-left: 4px solid #f00; color: #f00; }
        .warn { border-left: 4px solid #ff0; color: #ff0; }
        pre { background: #222; padding: 10px; overflow-x: auto; }
        button { 
            background: #0f0; 
            color: #000; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            margin: 5px;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover { background: #0ff; }
    </style>
</head>
<body>
    <h1>🔍 V14.0 ERP 模块诊断工具</h1>
    
    <div id="results"></div>
    
    <h2>诊断操作</h2>
    <button onclick="runDiagnostics()">🔄 重新运行诊断</button>
    <button onclick="downloadReport()">📥 下载诊断报告</button>
    <button onclick="clearCache()">🗑️ 清除缓存并重载</button>
    
    <script>
        function runDiagnostics() {
            const results = [];
            const container = document.getElementById('results');
            container.innerHTML = '<h2>诊断结果</h2>';
            
            // 1. 检查所有模块是否存在
            const requiredModules = [
                'WorkbenchConfig',
                'WorkbenchUtils',
                'WorkbenchStorage',
                'WorkbenchDashboard',
                'WorkbenchOrders',
                'WorkbenchSuppliers',
                'WorkbenchFinance'
            ];
            
            console.log('=== 模块诊断开始 ===');
            
            requiredModules.forEach(moduleName => {
                const exists = !!window[moduleName];
                const type = typeof window[moduleName];
                
                const test = {
                    name: moduleName,
                    exists: exists,
                    type: type,
                    status: exists ? 'PASS' : 'FAIL'
                };
                
                results.push(test);
                
                const div = document.createElement('div');
                div.className = `test ${test.status === 'PASS' ? 'pass' : 'fail'}`;
                div.innerHTML = `
                    <strong>${test.status === 'PASS' ? '✅' : '❌'} ${moduleName}</strong><br>
                    存在: ${exists}<br>
                    类型: ${type}<br>
                    ${exists ? `方法数: ${Object.keys(window[moduleName]).length}` : ''}
                `;
                container.appendChild(div);
                
                console.log(`[${test.status}] ${moduleName}: exists=${exists}, type=${type}`);
            });
            
            // 2. 检查 window 对象中所有以 Workbench 开头的属性
            const workbenchProps = Object.keys(window).filter(k => k.startsWith('Workbench'));
            
            const div2 = document.createElement('div');
            div2.className = 'test pass';
            div2.innerHTML = `
                <strong>📊 Window对象中的Workbench属性 (${workbenchProps.length}个)</strong><br>
                <pre>${JSON.stringify(workbenchProps, null, 2)}</pre>
            `;
            container.appendChild(div2);
            
            console.log('Window.Workbench* 属性:', workbenchProps);
            
            // 3. 检查脚本加载状态
            const scripts = Array.from(document.querySelectorAll('script[src]'));
            const jsScripts = scripts.filter(s => s.src.includes('.js'));
            
            const div3 = document.createElement('div');
            div3.className = 'test warn';
            div3.innerHTML = `
                <strong>📜 已加载的JS文件 (${jsScripts.length}个)</strong><br>
                <pre>${jsScripts.map(s => s.src).join('\n')}</pre>
            `;
            container.appendChild(div3);
            
            // 4. 统计失败的模块
            const failedModules = results.filter(r => r.status === 'FAIL');
            
            const summary = document.createElement('div');
            summary.className = `test ${failedModules.length === 0 ? 'pass' : 'fail'}`;
            summary.innerHTML = `
                <h3>📋 诊断摘要</h3>
                总模块数: ${requiredModules.length}<br>
                通过: ${requiredModules.length - failedModules.length}<br>
                失败: ${failedModules.length}<br>
                ${failedModules.length > 0 ? `<br><strong>缺失模块: ${failedModules.map(m => m.name).join(', ')}</strong>` : ''}
            `;
            container.appendChild(summary);
            
            // 5. 浏览器信息
            const browserInfo = document.createElement('div');
            browserInfo.className = 'test warn';
            browserInfo.innerHTML = `
                <h3>🌐 浏览器信息</h3>
                User Agent: ${navigator.userAgent}<br>
                Platform: ${navigator.platform}<br>
                Language: ${navigator.language}<br>
                Cookies Enabled: ${navigator.cookieEnabled}<br>
                Online: ${navigator.onLine}
            `;
            container.appendChild(browserInfo);
            
            console.log('=== 模块诊断结束 ===');
            
            // 保存诊断结果到全局
            window.diagnosticResults = results;
            
            return results;
        }
        
        function downloadReport() {
            const report = {
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                results: window.diagnosticResults || [],
                windowProps: Object.keys(window).filter(k => k.startsWith('Workbench')),
                scripts: Array.from(document.querySelectorAll('script[src]')).map(s => s.src)
            };
            
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `V14.0-Diagnostic-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert('诊断报告已下载！');
        }
        
        function clearCache() {
            if (confirm('确定要清除缓存并重新加载吗？')) {
                // 清除 localStorage
                localStorage.clear();
                
                // 强制刷新
                location.reload(true);
            }
        }
        
        // 页面加载时自动运行诊断
        window.addEventListener('load', () => {
            console.log('诊断工具已加载');
            runDiagnostics();
        });
    </script>
    
    <!-- 加载所有模块 -->
    <script src="js/workbench-config.js"></script>
    <script src="js/workbench-utils.js"></script>
    <script src="js/workbench-storage.js"></script>
    <script src="js/workbench-dashboard.js"></script>
    <script src="js/workbench-orders.js"></script>
    <script src="js/workbench-suppliers.js"></script>
    <script src="js/workbench-finance.js"></script>
</body>
</html>
