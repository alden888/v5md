<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>JS 文件内容检查</title>
    <style>
        body { 
            font-family: monospace; 
            background: #000; 
            color: #0f0; 
            padding: 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #ff0; }
        button { 
            background: #0f0; 
            color: #000; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            margin: 10px 0;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover { background: #0ff; }
        pre { 
            background: #111; 
            padding: 15px; 
            overflow-x: auto;
            border: 1px solid #333;
            margin: 10px 0;
        }
        .pass { color: #0f0; }
        .fail { color: #f00; }
        .warn { color: #ff0; }
        .section { 
            margin: 20px 0; 
            padding: 15px; 
            background: #111; 
            border-left: 4px solid #0f0;
        }
        .error-section {
            border-left-color: #f00;
        }
    </style>
</head>
<body>
    <h1>🔍 WorkbenchSuppliers.js 文件内容检查</h1>
    
    <button onclick="checkFile()">🔄 检查服务器文件</button>
    <button onclick="downloadContent()">📥 下载文件内容</button>
    
    <div id="results"></div>
    
    <script>
        async function checkFile() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>正在检查...</h2>';
            
            try {
                // 添加时间戳避免缓存
                const timestamp = new Date().getTime();
                const url = `js/workbench-suppliers.js?t=${timestamp}`;
                
                const response = await fetch(url);
                const content = await response.text();
                
                results.innerHTML = '';
                
                // 1. 基本信息
                const infoDiv = document.createElement('div');
                infoDiv.className = 'section';
                infoDiv.innerHTML = `
                    <h2>📊 文件基本信息</h2>
                    <div>URL: ${url}</div>
                    <div>状态码: ${response.status} ${response.statusText}</div>
                    <div>大小: ${content.length} 字节 (${(content.length / 1024).toFixed(2)} KB)</div>
                    <div>行数: ${content.split('\n').length}</div>
                `;
                results.appendChild(infoDiv);
                
                // 2. 检查文件开头
                const lines = content.split('\n');
                const firstDiv = document.createElement('div');
                firstDiv.className = 'section';
                firstDiv.innerHTML = `
                    <h2>📄 文件开头 (前15行)</h2>
                    <pre>${lines.slice(0, 15).join('\n')}</pre>
                `;
                results.appendChild(firstDiv);
                
                // 3. 检查文件结尾（最关键！）
                const lastDiv = document.createElement('div');
                const last20 = lines.slice(-20).join('\n');
                
                // 检查是否包含错误代码
                const hasError1 = last20.includes('WorkbenchSuppliersModule');
                const hasError2 = last20.includes('if (!window.WorkbenchSuppliers)');
                const hasCorrectCode = last20.includes('window.WorkbenchSuppliers = WorkbenchSuppliers');
                
                const isCorrect = !hasError1 && !hasError2 && hasCorrectCode;
                
                lastDiv.className = isCorrect ? 'section' : 'section error-section';
                lastDiv.innerHTML = `
                    <h2>🔥 文件结尾 (后20行) - ${isCorrect ? '<span class="pass">正确</span>' : '<span class="fail">有问题</span>'}</h2>
                    <pre>${last20}</pre>
                    
                    <h3>检查结果：</h3>
                    <div class="${hasError1 ? 'fail' : 'pass'}">
                        ${hasError1 ? '❌' : '✅'} WorkbenchSuppliersModule 引用
                        ${hasError1 ? '(发现错误代码！)' : '(未发现)'}
                    </div>
                    <div class="${hasError2 ? 'fail' : 'pass'}">
                        ${hasError2 ? '❌' : '✅'} if (!window.WorkbenchSuppliers) 语句
                        ${hasError2 ? '(发现错误代码！)' : '(未发现)'}
                    </div>
                    <div class="${hasCorrectCode ? 'pass' : 'fail'}">
                        ${hasCorrectCode ? '✅' : '❌'} 正确的挂载代码
                        ${hasCorrectCode ? '(已找到)' : '(未找到！)'}
                    </div>
                `;
                results.appendChild(lastDiv);
                
                // 4. 诊断结论
                const conclusionDiv = document.createElement('div');
                conclusionDiv.className = isCorrect ? 'section' : 'section error-section';
                
                if (isCorrect) {
                    conclusionDiv.innerHTML = `
                        <h2 class="pass">✅ 文件内容正确</h2>
                        <p>服务器上的文件已经是修复后的版本。</p>
                        <p><strong>问题可能是：</strong></p>
                        <ul>
                            <li>浏览器缓存了旧版本的 JS 文件</li>
                            <li>需要完全清除缓存并重启浏览器</li>
                        </ul>
                        <p><strong>解决方法：</strong></p>
                        <ol>
                            <li>完全关闭浏览器（不只是关标签页）</li>
                            <li>重新打开浏览器</li>
                            <li>按 Ctrl+Shift+Delete 清除缓存</li>
                            <li>选择"所有时间"</li>
                            <li>勾选"缓存的图片和文件"</li>
                            <li>清除</li>
                            <li>使用无痕窗口重新测试</li>
                        </ol>
                    `;
                } else {
                    conclusionDiv.innerHTML = `
                        <h2 class="fail">❌ 文件内容有误</h2>
                        <p>服务器上的文件<strong>仍然是旧版本</strong>，需要重新上传。</p>
                        <p><strong>需要修改的部分：</strong></p>
                        <pre class="fail">// ❌ 删除这些行：
if (!window.WorkbenchSuppliers) {
  window.WorkbenchSuppliers = new WorkbenchSuppliersModule();</pre>
                        <pre class="pass">// ✅ 保留这一行：
window.WorkbenchSuppliers = WorkbenchSuppliers;</pre>
                        
                        <p><strong>正确的文件末尾应该是：</strong></p>
                        <pre>    }
};

// 🔥 FIX: 显式挂载到 window 对象
window.WorkbenchSuppliers = WorkbenchSuppliers;</pre>
                    `;
                }
                results.appendChild(conclusionDiv);
                
                // 保存内容供下载
                window.fileContent = content;
                
            } catch (error) {
                results.innerHTML = `
                    <div class="section error-section">
                        <h2 class="fail">❌ 检查失败</h2>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }
        
        function downloadContent() {
            if (!window.fileContent) {
                alert('请先点击"检查服务器文件"');
                return;
            }
            
            const blob = new Blob([window.fileContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `workbench-suppliers-server-copy-${Date.now()}.js`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert('服务器文件内容已下载！请检查文件末尾。');
        }
        
        // 页面加载时自动检查
        window.addEventListener('load', () => {
            checkFile();
        });
    </script>
</body>
</html>
